<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>29. Young's Double-Slit, Single-Slit & Diffraction Grating in 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 330px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    #hud h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 6px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin: 5px 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-label { color: #94a3b8; }
    .stat-val { color: #f8fafc; font-weight: 600; }
    .legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11.5px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
    .swatch { width: 12px; height: 4px; border-radius: 2px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <h2>29. Interference &amp; Diffraction 3D</h2>
    <div class="stat-row"><span class="stat-label">Aperture Mode:</span><span class="stat-val" id="val-mode">Double-Slit (N=2)</span></div>
    <div class="stat-row"><span class="stat-label">Wavelength (λ):</span><span class="stat-val" id="val-lam">520 nm</span></div>
    <div class="stat-row"><span class="stat-label">Fringe Spacing (Δy):</span><span class="stat-val" id="val-dy">1.85 cm</span></div>
    <div class="stat-row"><span class="stat-label">Path Diff Δr(y_probe):</span><span class="stat-val" id="val-dr">0.50 λ</span></div>
    <div class="stat-row"><span class="stat-label">Probe Intensity I/I₀:</span><span class="stat-val" id="val-int">0.842</span></div>
    <div class="legend">
      <div class="legend-item"><span class="swatch" style="background:#38bdf8"></span>Total Interference Intensity I(θ)</div>
      <div class="legend-item"><span class="swatch" style="background:#f59e0b"></span>Single-Slit Diffraction Envelope sinc²(β)</div>
      <div class="legend-item"><span class="swatch" style="background:#f43f5e"></span>Path Vectors r₁, r₂ to Probe Point</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(1.5, 9.5, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(1, 0.5, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(10, 18, 12);
    scene.add(dirLight);

    const params = {
      apertureMode: 'Double-Slit',
      numSlits: 2,
      wavelengthNm: 520,
      slitSeparation: 2.2, // d (in simulation units)
      slitWidth: 0.65,     // a (in simulation units)
      probeZ: 1.6,
      paused: false,
      reset() {
        this.apertureMode = 'Double-Slit';
        this.numSlits = 2;
        this.wavelengthNm = 520;
        this.slitSeparation = 2.2;
        this.slitWidth = 0.65;
        this.probeZ = 1.6;
        this.paused = false;
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    };

    const gui = new GUI({ title: 'Diffraction & Interference' });
    gui.add(params, 'apertureMode', ['Single-Slit', 'Double-Slit', 'Diffraction Grating']).name('Aperture Mode').onChange(v => {
      if (v === 'Single-Slit') params.numSlits = 1;
      else if (v === 'Double-Slit') params.numSlits = 2;
      else params.numSlits = 5;
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    gui.add(params, 'numSlits', 1, 8, 1).name('Slit Count (N)').onChange(v => {
      if (v === 1) params.apertureMode = 'Single-Slit';
      else if (v === 2) params.apertureMode = 'Double-Slit';
      else params.apertureMode = 'Diffraction Grating';
      gui.controllersRecursive().forEach(c => c.updateDisplay());
    });
    gui.add(params, 'wavelengthNm', 400, 700, 5).name('Wavelength λ (nm)');
    gui.add(params, 'slitSeparation', 1.0, 4.0, 0.1).name('Slit Spacing (d)');
    gui.add(params, 'slitWidth', 0.2, 1.8, 0.05).name('Slit Width (a)');
    gui.add(params, 'probeZ', -6.0, 6.0, 0.1).name('Screen Probe z');
    gui.add(params, 'paused').name('Pause');
    gui.add(params, 'reset').name('Reset');

    // Convert wavelength (400..700 nm) to visible RGB Color
    function wavelengthToColor(nm) {
      const hue = THREE.MathUtils.clamp((700 - nm) / 300 * 0.76, 0, 0.78);
      return new THREE.Color().setHSL(hue, 0.95, 0.55);
    }

    const barrierX = -5.5;
    const screenX = 5.5;
    const L = screenX - barrierX; // Distance L = 11.0

    // 3D Wavefront surface mesh between barrierX and screenX
    const wfSegX = 95;
    const wfSegZ = 110;
    const wfGeo = new THREE.PlaneGeometry(L, 14, wfSegX, wfSegZ);
    wfGeo.rotateX(-Math.PI / 2);
    wfGeo.translate((barrierX + screenX) / 2, -1.2, 0);
    const wfColors = new Float32Array((wfSegX + 1) * (wfSegZ + 1) * 3);
    wfGeo.setAttribute('color', new THREE.BufferAttribute(wfColors, 3));

    const wfMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.35,
      metalness: 0.15,
      side: THREE.DoubleSide
    });
    const wfMesh = new THREE.Mesh(wfGeo, wfMat);
    scene.add(wfMesh);

    // Barrier Wall at x = barrierX with glowing slit markers
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x1e293b,
      roughness: 0.6,
      metalness: 0.3,
      transparent: true,
      opacity: 0.85
    });
    const barrierWall = new THREE.Mesh(new THREE.BoxGeometry(0.22, 3.2, 14.4), wallMat);
    barrierWall.position.set(barrierX, 0.2, 0);
    scene.add(barrierWall);

    const slitMarkers = [];
    for (let i = 0; i < 8; i++) {
      const sMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 3.22, 1),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      scene.add(sMesh);
      slitMarkers.push(sMesh);
    }

    // Observation screen at x = screenX
    const screenPts = 240;
    const screenZSpan = 14.0;

    // 3D Intensity curve I(z) plotted vertically along observation screen
    const intCurveGeo = new THREE.BufferGeometry();
    intCurveGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(screenPts * 3), 3));
    const intCurveLine = new THREE.Line(
      intCurveGeo,
      new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 })
    );
    scene.add(intCurveLine);

    // Single-slit diffraction envelope curve sinc^2(beta)
    const envCurveGeo = new THREE.BufferGeometry();
    envCurveGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(screenPts * 3), 3));
    const envCurveLine = new THREE.Line(
      envCurveGeo,
      new THREE.LineDashedMaterial({ color: 0xf59e0b, dashSize: 0.22, gapSize: 0.14 })
    );
    scene.add(envCurveLine);

    // Path difference vectors from central two slits to probe point on screen
    const pathArrow1 = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xf43f5e, 0.3, 0.16);
    const pathArrow2 = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0xf43f5e, 0.3, 0.16);
    scene.add(pathArrow1, pathArrow2);

    const probeSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xf43f5e })
    );
    scene.add(probeSphere);

    function sinc(u) {
      return Math.abs(u) < 1e-5 ? 1.0 : Math.sin(u) / u;
    }

    function computeIntensity(z, N, d, a, lambdaSim) {
      const sinTheta = z / Math.sqrt(L * L + z * z);
      const beta = (Math.PI * a * sinTheta) / lambdaSim;
      const diffFactor = Math.pow(sinc(beta), 2);

      if (N === 1) {
        return { total: diffFactor, env: diffFactor };
      }
      const alpha = (Math.PI * d * sinTheta) / lambdaSim;
      let interfFactor = 1.0;
      const sinAlpha = Math.sin(alpha);
      if (Math.abs(sinAlpha) > 1e-4) {
        interfFactor = Math.pow(Math.sin(N * alpha) / (N * sinAlpha), 2);
      }
      return { total: diffFactor * interfFactor, env: diffFactor };
    }

    const elMode = document.getElementById('val-mode');
    const elLam = document.getElementById('val-lam');
    const elDy = document.getElementById('val-dy');
    const elDr = document.getElementById('val-dr');
    const elInt = document.getElementById('val-int');

    let simTime = 0;
    let lastTime = performance.now();
    let frameCount = 0;
    let hasNaN = false;

    function updateInterference(dt) {
      if (!params.paused) {
        simTime += dt * 4.5;
      }

      const N = params.numSlits;
      const d = params.slitSeparation;
      const a = Math.min(params.slitWidth, N > 1 ? d * 0.85 : params.slitWidth);
      const lambdaSim = (params.wavelengthNm / 500) * 0.85; // scaled simulation wavelength
      const k = (2 * Math.PI) / lambdaSim;
      const baseColor = wavelengthToColor(params.wavelengthNm);

      intCurveLine.material.color.copy(baseColor);

      // Compute slit Z positions
      const slitZ = [];
      for (let s = 0; s < 8; s++) {
        if (s < N) {
          const zPos = (s - (N - 1) / 2) * d;
          slitZ.push(zPos);
          slitMarkers[s].visible = true;
          slitMarkers[s].position.set(barrierX, 0.2, zPos);
          slitMarkers[s].scale.set(1, 1, Math.max(0.12, a * 0.45));
          slitMarkers[s].material.color.copy(baseColor);
        } else {
          slitMarkers[s].visible = false;
        }
      }

      // Update 3D Wavefront Field
      const posAttr = wfGeo.attributes.position;
      const colAttr = wfGeo.attributes.color;
      const count = posAttr.count;

      for (let i = 0; i < count; i++) {
        const vx = posAttr.getX(i);
        const vz = posAttr.getZ(i);

        let sumAmp = 0;
        for (let s = 0; s < N; s++) {
          const dx = vx - barrierX;
          const dz = vz - slitZ[s];
          const r = Math.sqrt(dx * dx + dz * dz + 0.15);
          // Include single-slit directional envelope
          const sinTh = dz / r;
          const env = sinc((Math.PI * a * sinTh) / lambdaSim);
          sumAmp += (env / Math.sqrt(Math.max(1.0, r * 0.4))) * Math.sin(k * r - simTime);
        }
        const normAmp = (sumAmp / Math.sqrt(N)) * 0.38;
        posAttr.setY(i, -1.2 + normAmp);

        const brightness = THREE.MathUtils.clamp(0.18 + Math.abs(normAmp) * 1.4, 0.08, 1.0);
        colAttr.setXYZ(
          i,
          baseColor.r * brightness,
          baseColor.g * brightness,
          baseColor.b * brightness
        );
      }
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
      wfGeo.computeVertexNormals();

      // Update Screen Intensity Curve & Single-Slit Envelope
      const intArr = intCurveGeo.attributes.position.array;
      const envArr = envCurveGeo.attributes.position.array;
      const maxPeakHeight = 4.2;
      const baseScreenY = -1.2;

      for (let i = 0; i < screenPts; i++) {
        const z = ((i / (screenPts - 1)) - 0.5) * screenZSpan;
        const res = computeIntensity(z, N, d, a, lambdaSim);

        intArr[i * 3] = screenX;
        intArr[i * 3 + 1] = baseScreenY + res.total * maxPeakHeight;
        intArr[i * 3 + 2] = z;

        envArr[i * 3] = screenX;
        envArr[i * 3 + 1] = baseScreenY + res.env * maxPeakHeight;
        envArr[i * 3 + 2] = z;
      }
      intCurveGeo.attributes.position.needsUpdate = true;
      envCurveGeo.attributes.position.needsUpdate = true;
      envCurveLine.computeLineDistances();

      // Update Probe Point & Path Vectors r1, r2
      const probeRes = computeIntensity(params.probeZ, N, d, a, lambdaSim);
      const probePt = new THREE.Vector3(
        screenX,
        baseScreenY + probeRes.total * maxPeakHeight,
        params.probeZ
      );
      probeSphere.position.copy(probePt);

      const s1Pt = new THREE.Vector3(barrierX, baseScreenY, slitZ[0]);
      const v1 = new THREE.Vector3().subVectors(probePt, s1Pt);
      const r1 = v1.length();
      pathArrow1.position.copy(s1Pt);
      pathArrow1.setDirection(v1.clone().normalize());
      pathArrow1.setLength(r1, 0.3, 0.16);

      let pathDiffWave = 0;
      if (N >= 2) {
        pathArrow2.visible = true;
        const s2Pt = new THREE.Vector3(barrierX, baseScreenY, slitZ[1]);
        const v2 = new THREE.Vector3().subVectors(probePt, s2Pt);
        const r2 = v2.length();
        pathArrow2.position.copy(s2Pt);
        pathArrow2.setDirection(v2.clone().normalize());
        pathArrow2.setLength(r2, 0.3, 0.16);
        pathDiffWave = Math.abs(r2 - r1) / lambdaSim;
      } else {
        pathArrow2.visible = false;
        pathDiffWave = (a * Math.abs(params.probeZ) / Math.sqrt(L * L + params.probeZ * params.probeZ)) / lambdaSim;
      }

      const fringeSpacing = N > 1 ? (lambdaSim * L) / d : (lambdaSim * L) / a;

      if (Number.isNaN(probeRes.total)) hasNaN = true;

      // Update HUD
      elMode.textContent = `${params.apertureMode} (N=${N})`;
      elLam.textContent = `${params.wavelengthNm} nm`;
      elDy.textContent = `${fringeSpacing.toFixed(2)} cm`;
      elDr.textContent = `${pathDiffWave.toFixed(2)} λ`;
      elInt.textContent = `${probeRes.total.toFixed(3)} I₀`;
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      frameCount++;

      updateInterference(dt);
      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setInterval(() => {
      const fps = frameCount || 60;
      frameCount = 0;
      window.parent.postMessage({
        type: 'physicraft_telemetry',
        fps,
        hasNaN,
        errors: [],
        energyBounded: true
      }, '*');
    }, 1000);
  </script>
</body>
</html>
