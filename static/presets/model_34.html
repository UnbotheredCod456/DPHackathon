<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>34. Parallel Plate Capacitor with Dielectric Insertion & Fringe Fields</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(10, 15, 30, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 320px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      font-size: 13px;
      line-height: 1.6;
      z-index: 10;
    }
    #hud h2 {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 6px;
    }
    .row { display: flex; justify-content: space-between; gap: 16px; }
    .val { font-family: 'JetBrains Mono', monospace; color: #f8fafc; font-weight: 600; }
    .legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h2>34. Parallel Plate Capacitor & Dielectric</h2>
    <div class="row"><span>Dielectric Constant (κ):</span><span class="val" id="v-kappa">4.00</span></div>
    <div class="row"><span>Insertion Fraction (f):</span><span class="val" id="v-ins">60%</span></div>
    <div class="row"><span>Effective Capacitance (C):</span><span class="val" id="v-cap">49.6 pF</span></div>
    <div class="row"><span>Internal E-Field (E_diel):</span><span class="val" id="v-efield">1.25 kV/m</span></div>
    <div class="row"><span>Energy Density (u_E = ½κε₀E²):</span><span class="val" id="v-ued">27.7 μJ/m³</span></div>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#ef4444"></span>Top Plate (+V)</div>
      <div class="legend-item"><span class="dot" style="background:#38bdf8"></span>Bottom Plate (0 V)</div>
      <div class="legend-item"><span class="dot" style="background:#facc15"></span>E-Field Vector</div>
      <div class="legend-item"><span class="dot" style="background:#a855f7"></span>Induced Dipole P</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GUI } from 'lil-gui';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.02);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(7.5, 4.5, 9.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    scene.add(new THREE.AmbientLight(0x94a3b8, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(8, 12, 10);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(20, 20, 0x1e293b, 0x0f172a);
    grid.position.y = -3.8;
    scene.add(grid);

    const plateW = 6.0;
    const plateD = 4.5;

    // Top (+V) and Bottom (0V) conducting plates
    const topPlate = new THREE.Mesh(
      new THREE.BoxGeometry(plateW, 0.22, plateD),
      new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.7, roughness: 0.25 })
    );
    const botPlate = new THREE.Mesh(
      new THREE.BoxGeometry(plateW, 0.22, plateD),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.7, roughness: 0.25 })
    );
    scene.add(topPlate, botPlate);

    // Dielectric Slab with polarization arrows inside
    const slabGroup = new THREE.Group();
    const slabMat = new THREE.MeshPhysicalMaterial({
      color: 0xa855f7,
      transparent: true,
      opacity: 0.32,
      roughness: 0.15,
      metalness: 0.05
    });
    const slabMesh = new THREE.Mesh(new THREE.BoxGeometry(plateW, 1.0, plateD * 0.96), slabMat);
    slabGroup.add(slabMesh);

    const polArrows = [];
    for (let ix = -2; ix <= 2; ix += 2) {
      for (let iz = -1; iz <= 1; iz += 2) {
        const pArr = new THREE.ArrowHelper(
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(ix * 0.9, -0.35, iz * 1.1),
          0.7,
          0xd8b4fe,
          0.22,
          0.14
        );
        slabGroup.add(pArr);
        polArrows.push(pArr);
      }
    }
    scene.add(slabGroup);

    // Internal E-field arrows
    const eArrows = [];
    for (let ix = -2.2; ix <= 2.2; ix += 1.1) {
      for (let iz = -1.4; iz <= 1.4; iz += 1.4) {
        const arr = new THREE.ArrowHelper(
          new THREE.Vector3(0, -1, 0),
          new THREE.Vector3(ix, 1.0, iz),
          1.5,
          0xfacc15,
          0.28,
          0.18
        );
        scene.add(arr);
        eArrows.push({ arrow: arr, x: ix, z: iz });
      }
    }

    // Fringe field curved lines on left and right edges
    const fringeGroup = new THREE.Group();
    scene.add(fringeGroup);

    function rebuildFringeLines(sep) {
      while (fringeGroup.children.length > 0) {
        const c = fringeGroup.children.pop();
        if (c.geometry) c.geometry.dispose();
      }
      const halfY = sep * 0.5;
      const zOffsets = [-1.5, 0, 1.5];
      const bulges = [0.65, 1.25];
      [-1, 1].forEach(side => {
        const edgeX = side * (plateW * 0.5);
        for (const z of zOffsets) {
          for (const b of bulges) {
            const curve = new THREE.CubicBezierCurve3(
              new THREE.Vector3(edgeX, halfY, z),
              new THREE.Vector3(edgeX + side * b, halfY * 0.6, z),
              new THREE.Vector3(edgeX + side * b, -halfY * 0.6, z),
              new THREE.Vector3(edgeX, -halfY, z)
            );
            const pts = curve.getPoints(28);
            const geom = new THREE.BufferGeometry().setFromPoints(pts);
            const line = new THREE.Line(
              geom,
              new THREE.LineBasicMaterial({ color: 0xfde047, transparent: true, opacity: 0.55 })
            );
            fringeGroup.add(line);
          }
        }
      });
    }

    const params = {
      voltage: 12.0,
      plateSep: 2.4,
      kappa: 4.0,
      insertion: 0.6,
      autoSlide: false,
      paused: false,
      reset() {
        this.voltage = 12.0;
        this.plateSep = 2.4;
        this.kappa = 4.0;
        this.insertion = 0.6;
        this.autoSlide = false;
        this.paused = false;
        gui.controllersRecursive().forEach(c => c.updateDisplay());
      }
    };

    const gui = new GUI({ title: 'Capacitor Controls' });
    gui.add(params, 'voltage', 2.0, 24.0, 0.5).name('Voltage V (V)');
    gui.add(params, 'plateSep', 1.4, 3.8, 0.1).name('Plate Gap d (mm)');
    gui.add(params, 'kappa', 1.0, 8.0, 0.1).name('Dielectric κ');
    gui.add(params, 'insertion', 0.0, 1.0, 0.01).name('Slab Insertion f').listen();
    gui.add(params, 'autoSlide').name('Oscillate Dielectric');
    gui.add(params, 'paused').name('Pause Animation');
    gui.add(params, 'reset').name('Reset');

    let simTime = 0;
    let lastSep = 0;
    let lastTime = performance.now();
    let frameCount = 0;
    let currentFps = 60;
    const runtimeErrors = [];
    window.addEventListener('error', (e) => runtimeErrors.push(e.message));

    function animate(now) {
      requestAnimationFrame(animate);
      frameCount++;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (!params.paused) {
        simTime += dt;
        if (params.autoSlide) {
          params.insertion = 0.5 + 0.45 * Math.sin(simTime * 1.4);
        }
      }

      const d = params.plateSep;
      if (Math.abs(d - lastSep) > 0.01) {
        rebuildFringeLines(d);
        lastSep = d;
      }

      topPlate.position.y = d * 0.5 + 0.11;
      botPlate.position.y = -d * 0.5 - 0.11;

      // Position dielectric slab entering from the left (-X to +X)
      const slabCenterX = -plateW * (1.0 - params.insertion);
      const slabRightEdge = slabCenterX + plateW * 0.5;
      slabGroup.position.set(slabCenterX, 0, 0);
      slabMesh.scale.set(1, d * 0.92, 1);

      // Update internal E-field arrows (weaker inside dielectric by 1/kappa)
      for (const item of eArrows) {
        const insideSlab = item.x <= slabRightEdge;
        const scaleFactor = insideSlab ? 1.0 / Math.pow(params.kappa, 0.45) : 1.0;
        const len = Math.max(0.35, d * 0.85 * scaleFactor * (params.voltage / 12.0));
        item.arrow.position.set(item.x, d * 0.44, item.z);
        item.arrow.setLength(Math.min(d * 0.88, len), 0.25, 0.16);
        item.arrow.setColor(insideSlab ? 0x38bdf8 : 0xfacc15);
      }

      // Compute physical quantities
      const c0 = 38.0 / d; // pF baseline
      const cEff = c0 * (1.0 - params.insertion + params.kappa * params.insertion);
      const eVacuum = params.voltage / d; // kV/m
      const eDiel = eVacuum / params.kappa;
      const energyDensity = 0.5 * 8.854 * params.kappa * eDiel * eDiel;

      document.getElementById('v-kappa').textContent = params.kappa.toFixed(2);
      document.getElementById('v-ins').textContent = `${Math.round(params.insertion * 100)}%`;
      document.getElementById('v-cap').textContent = `${cEff.toFixed(1)} pF`;
      document.getElementById('v-efield').textContent = `${eDiel.toFixed(2)} kV/m`;
      document.getElementById('v-ued').textContent = `${energyDensity.toFixed(1)} μJ/m³`;

      controls.update();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    setInterval(() => {
      currentFps = frameCount;
      frameCount = 0;
      const hasNaN = Number.isNaN(slabGroup.position.x);
      window.parent.postMessage({
        type: 'physicraft_telemetry',
        fps: currentFps || 60,
        hasNaN,
        errors: runtimeErrors,
        energyBounded: true
      }, '*');
    }, 1000);
  </script>
</body>
</html>
