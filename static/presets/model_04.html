<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhysiCraft — 04. 2D Billiard Collisions (Lab & Center-of-Mass Frames)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070b14; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 12px;
    padding: 14px 18px; min-width: 315px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    font-size: 12.5px; line-height: 1.55;
  }
  #hud h3 { font-size: 13px; color: #38bdf8; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .label { color: #94a3b8; }
  .val { color: #f8fafc; font-weight: 600; }
  .legend { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(148,163,184,0.18); display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h3>04 · Billiard Collisions (Lab &amp; CoM Frame)</h3>
  <div class="row"><span class="label">Reference Frame:</span><span class="val" id="hFrame">LAB FRAME</span></div>
  <div class="row"><span class="label">Total Momentum |P_tot|:</span><span class="val" id="hMom">0.00 kg·m/s</span></div>
  <div class="row"><span class="label">CoM Velocity |V_cm|:</span><span class="val" id="hVcm">0.00 m/s</span></div>
  <div class="row"><span class="label">Ball 1 Speed |v_1|:</span><span class="val" id="hV1">0.00 m/s</span></div>
  <div class="row"><span class="label">Ball 2 Speed |v_2|:</span><span class="val" id="hV2">0.00 m/s</span></div>
  <div class="row"><span class="label">Kinetic Energy KE:</span><span class="val" id="hKE">0.00 J</span></div>
  <div class="legend">
    <span><i class="dot" style="background:#38bdf8"></i>Ball 1 p₁</span>
    <span><i class="dot" style="background:#f43f5e"></i>Ball 2 p₂</span>
    <span><i class="dot" style="background:#facc15"></i>Center of Mass V_cm</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'lil-gui';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 22, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

scene.add(new THREE.AmbientLight(0x94a3b8, 0.75));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
dirLight.position.set(10, 25, 12);
dirLight.castShadow = true;
scene.add(dirLight);

// Billiard Table Bed & Cushions
const W = 22, H = 13;
const bed = new THREE.Mesh(
  new THREE.BoxGeometry(W, 0.4, H),
  new THREE.MeshStandardMaterial({ color: 0x0f2942, roughness: 0.6, metalness: 0.1 })
);
bed.position.y = -0.2;
bed.receiveShadow = true;
scene.add(bed);

const grid = new THREE.GridHelper(W, 22, 0x1e3a5f, 0x172554);
grid.scale.z = H / W;
grid.position.y = 0.01;
scene.add(grid);

const railMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.5, roughness: 0.35 });
const railN = new THREE.Mesh(new THREE.BoxGeometry(W + 0.8, 0.8, 0.4), railMat);
railN.position.set(0, 0.2, -H / 2 - 0.2);
const railS = railN.clone();
railS.position.set(0, 0.2, H / 2 + 0.2);
const railE = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.8, H), railMat);
railE.position.set(W / 2 + 0.2, 0.2, 0);
const railW = railE.clone();
railW.position.set(-W / 2 - 0.2, 0.2, 0);
scene.add(railN, railS, railE, railW);

// Balls & Center of Mass Marker
const R = 0.75;
const ball1 = new THREE.Mesh(
  new THREE.SphereGeometry(R, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.3, roughness: 0.2, metalness: 0.3 })
);
const ball2 = new THREE.Mesh(
  new THREE.SphereGeometry(R, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xbe123c, emissiveIntensity: 0.3, roughness: 0.2, metalness: 0.3 })
);
ball1.castShadow = true;
ball2.castShadow = true;
scene.add(ball1, ball2);

const comMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.28, 20, 20),
  new THREE.MeshBasicMaterial({ color: 0xfacc15 })
);
scene.add(comMarker);

const comLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const comLine = new THREE.Line(comLineGeo, new THREE.LineDashedMaterial({ color: 0xfacc15, dashSize: 0.3, gapSize: 0.2 }));
scene.add(comLine);

const arrow1 = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 2, 0x38bdf8, 0.42, 0.25);
const arrow2 = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(), 2, 0xf43f5e, 0.42, 0.25);
const arrowCom = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 2, 0xfacc15, 0.42, 0.25);
scene.add(arrow1, arrow2, arrowCom);

const params = {
  m1: 2.0,
  m2: 2.0,
  v10: 7.5,
  impactB: 0.65,
  restitution: 1.0,
  comFrame: false,
  paused: false,
  reset: () => resetSim()
};

const state = {
  p1: new THREE.Vector3(),
  p2: new THREE.Vector3(),
  v1: new THREE.Vector3(),
  v2: new THREE.Vector3(),
  initialKE: 1
};

function resetSim() {
  state.p1.set(-6.5, R, params.impactB);
  state.p2.set(1.5, R, 0);
  state.v1.set(params.v10, 0, 0);
  state.v2.set(-1.5, 0, 0);
  state.initialKE = 0.5 * params.m1 * state.v1.lengthSq() + 0.5 * params.m2 * state.v2.lengthSq();
  controls.target.set(0, 0, 0);
}

function stepPhysics(dt) {
  state.p1.addScaledVector(state.v1, dt);
  state.p2.addScaledVector(state.v2, dt);

  // Ball-Ball Collision with Restitution e
  const delta = state.p2.clone().sub(state.p1);
  delta.y = 0;
  const dist = delta.length();
  const minDist = 2 * R;
  if (dist < minDist && dist > 1e-5) {
    const n = delta.clone().divideScalar(dist);
    const overlap = minDist - dist;
    const totalM = params.m1 + params.m2;
    state.p1.addScaledVector(n, -overlap * (params.m2 / totalM));
    state.p2.addScaledVector(n, overlap * (params.m1 / totalM));

    const relVel = state.v1.clone().sub(state.v2);
    const vn = relVel.dot(n);
    if (vn > 0) {
      const j = ((1 + params.restitution) * vn) / (1 / params.m1 + 1 / params.m2);
      state.v1.addScaledVector(n, -j / params.m1);
      state.v2.addScaledVector(n, j / params.m2);
    }
  }

  // Cushion Bounces
  const limX = W / 2 - R;
  const limZ = H / 2 - R;
  for (const [p, v] of [[state.p1, state.v1], [state.p2, state.v2]]) {
    if (p.x > limX) { p.x = limX; v.x = -Math.abs(v.x); }
    if (p.x < -limX) { p.x = -limX; v.x = Math.abs(v.x); }
    if (p.z > limZ) { p.z = limZ; v.z = -Math.abs(v.z); }
    if (p.z < -limZ) { p.z = -limZ; v.z = Math.abs(v.z); }
  }
}

const gui = new GUI({ title: '2D Collision Controls' });
gui.add(params, 'm1', 0.5, 5.0, 0.25).name('Mass m₁ (kg)').onChange(resetSim);
gui.add(params, 'm2', 0.5, 5.0, 0.25).name('Mass m₂ (kg)').onChange(resetSim);
gui.add(params, 'v10', 2.0, 14.0, 0.5).name('Cue Speed v₁ (m/s)').onChange(resetSim);
gui.add(params, 'impactB', -1.4, 1.4, 0.05).name('Impact Parameter b (m)').onChange(resetSim);
gui.add(params, 'restitution', 0.0, 1.0, 0.05).name('Restitution e').onChange(resetSim);
gui.add(params, 'comFrame').name('Center-of-Mass Frame');
gui.add(params, 'paused').name('Pause Simulation');
gui.add(params, 'reset').name('Reset Shot');

resetSim();

// Telemetry Heartbeat
let frameCount = 0;
let lastFpsTime = performance.now();
let currentFps = 60;
const runtimeErrors = [];
window.addEventListener('error', (e) => runtimeErrors.push(e.message));

setInterval(() => {
  const ke = 0.5 * params.m1 * state.v1.lengthSq() + 0.5 * params.m2 * state.v2.lengthSq();
  window.parent.postMessage({
    type: 'physicraft_telemetry',
    fps: Math.round(currentFps),
    hasNaN: Number.isNaN(state.p1.x) || Number.isNaN(state.p2.x),
    errors: runtimeErrors.slice(-5),
    energyBounded: ke <= state.initialKE * 1.05 + 1
  }, '*');
}, 1000);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 500) {
    currentFps = (frameCount * 1000) / (now - lastFpsTime);
    frameCount = 0;
    lastFpsTime = now;
  }

  if (!params.paused) {
    for (let i = 0; i < 4; i++) stepPhysics(dt / 4);
  }

  const totM = params.m1 + params.m2;
  const rCom = state.p1.clone().multiplyScalar(params.m1).addScaledVector(state.p2, params.m2).divideScalar(totM);
  const vCom = state.v1.clone().multiplyScalar(params.m1).addScaledVector(state.v2, params.m2).divideScalar(totM);

  ball1.position.copy(state.p1);
  ball2.position.copy(state.p2);
  comMarker.position.copy(rCom);

  comLineGeo.setFromPoints([state.p1, state.p2]);
  comLine.computeLineDistances();

  // If CoM frame is active, lock camera target onto rCom and display CoM-relative velocities
  if (params.comFrame) {
    controls.target.lerp(rCom, 0.25);
  } else {
    controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.15);
  }

  const dispV1 = params.comFrame ? state.v1.clone().sub(vCom) : state.v1.clone();
  const dispV2 = params.comFrame ? state.v2.clone().sub(vCom) : state.v2.clone();

  arrow1.position.copy(state.p1);
  if (dispV1.length() > 0.05) {
    arrow1.visible = true;
    arrow1.setDirection(dispV1.clone().normalize());
    arrow1.setLength(Math.min(4.5, 0.5 + dispV1.length() * 0.35), 0.4, 0.24);
  } else arrow1.visible = false;

  arrow2.position.copy(state.p2);
  if (dispV2.length() > 0.05) {
    arrow2.visible = true;
    arrow2.setDirection(dispV2.clone().normalize());
    arrow2.setLength(Math.min(4.5, 0.5 + dispV2.length() * 0.35), 0.4, 0.24);
  } else arrow2.visible = false;

  arrowCom.position.copy(rCom);
  if (!params.comFrame && vCom.length() > 0.05) {
    arrowCom.visible = true;
    arrowCom.setDirection(vCom.clone().normalize());
    arrowCom.setLength(Math.min(4.0, 0.5 + vCom.length() * 0.4), 0.38, 0.22);
  } else arrowCom.visible = false;

  const pTot = vCom.clone().multiplyScalar(totM).length();
  const ke = 0.5 * params.m1 * dispV1.lengthSq() + 0.5 * params.m2 * dispV2.lengthSq();

  document.getElementById('hFrame').textContent = params.comFrame ? 'CENTER-OF-MASS (P_tot = 0)' : 'LAB FRAME';
  document.getElementById('hMom').textContent = `${(params.comFrame ? 0 : pTot).toFixed(2)} kg·m/s`;
  document.getElementById('hVcm').textContent = `${vCom.length().toFixed(2)} m/s`;
  document.getElementById('hV1').textContent = `${dispV1.length().toFixed(2)} m/s`;
  document.getElementById('hV2').textContent = `${dispV2.length().toFixed(2)} m/s`;
  document.getElementById('hKE').textContent = `${ke.toFixed(2)} J`;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
