<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>12. Driven Damped Harmonic Oscillator: Resonance & Phase Lag</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      overflow: hidden;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(11, 18, 32, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 330px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      font-size: 12px;
      line-height: 1.6;
      z-index: 10;
    }
    #hud h3 {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #94a3b8;
    }
    .val {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      color: #f8fafc;
      font-weight: 600;
    }
    .legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #cbd5e1;
    }
    .swatch {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h3>12. Driven Damped Oscillator &amp; Resonance</h3>
    <div class="row"><span>Frequency Ratio (&omega;<sub>d</sub> / &omega;<sub>0</sub>):</span><span class="val" id="hud-ratio">1.00</span></div>
    <div class="row"><span>Steady-State Amplitude A(&omega;<sub>d</sub>):</span><span class="val" id="hud-amp">0.00 m</span></div>
    <div class="row"><span>Phase Lag &delta;(&omega;<sub>d</sub>):</span><span class="val" id="hud-phase">90.0&deg;</span></div>
    <div class="row"><span>Quality Factor Q:</span><span class="val" id="hud-q">0.00</span></div>
    <div class="row"><span>Instantaneous x(t), v(t):</span><span class="val" id="hud-xv">0.00 m, 0.00 m/s</span></div>
    <div class="legend">
      <span><i class="swatch" style="background:#f59e0b"></i>Drive Force F&#8407;<sub>d</sub></span>
      <span><i class="swatch" style="background:#22c55e"></i>Velocity v&#8407;</span>
      <span><i class="swatch" style="background:#ef4444"></i>Damping F&#8407;<sub>b</sub></span>
      <span><i class="swatch" style="background:#38bdf8"></i>A(&omega;) Curve</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const runtimeErrors = [];
    window.addEventListener('error', (e) => runtimeErrors.push(e.message));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 2.5, 16.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(8, 16, 12);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(28, 28, 0x1e293b, 0x0f172a);
    grid.position.y = -4.5;
    scene.add(grid);

    // Driven Piston + Spring + Mass on Left (x = -4.2)
    const oscX = -4.2;
    const pistonMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.65, 0.65, 0.35, 24),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.35 })
    );
    scene.add(pistonMesh);

    const springPts = 140;
    const springArr = new Float32Array(springPts * 3);
    const springGeo = new THREE.BufferGeometry();
    springGeo.setAttribute('position', new THREE.BufferAttribute(springArr, 3));
    const springLine = new THREE.Line(springGeo, new THREE.LineBasicMaterial({ color: 0x94a3b8 }));
    scene.add(springLine);

    const massMesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.25, 1.25, 1.25),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.35, roughness: 0.25 })
    );
    scene.add(massMesh);

    const driveArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0xf59e0b, 0.32, 0.18);
    const velArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0x22c55e, 0.32, 0.18);
    const dampArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0xef4444, 0.32, 0.18);
    scene.add(driveArrow, velArrow, dampArrow);

    // 3D Resonance Curve Board on Right (x = 0.2 to 6.8)
    const plotOrigin = new THREE.Vector3(0.4, -2.5, 0);
    const plotWidth = 6.2;
    const plotHeight = 5.2;

    const framePts = [
      plotOrigin,
      new THREE.Vector3(plotOrigin.x + plotWidth, plotOrigin.y, 0),
      plotOrigin,
      new THREE.Vector3(plotOrigin.x, plotOrigin.y + plotHeight, 0)
    ];
    scene.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(framePts),
      new THREE.LineBasicMaterial({ color: 0x475569 })
    ));

    // Vertical dashed resonance line at omega_d / omega_0 = 1
    const resLineX = plotOrigin.x + (1.0 / 2.5) * plotWidth;
    const resLine = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(resLineX, plotOrigin.y, 0),
        new THREE.Vector3(resLineX, plotOrigin.y + plotHeight, 0)
      ]),
      new THREE.LineBasicMaterial({ color: 0x334155 })
    );
    scene.add(resLine);

    const curveSamples = 180;
    const ampCurveArr = new Float32Array(curveSamples * 3);
    const ampCurveGeo = new THREE.BufferGeometry();
    ampCurveGeo.setAttribute('position', new THREE.BufferAttribute(ampCurveArr, 3));
    const ampCurveLine = new THREE.Line(ampCurveGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8 }));
    scene.add(ampCurveLine);

    const phaseCurveArr = new Float32Array(curveSamples * 3);
    const phaseCurveGeo = new THREE.BufferGeometry();
    phaseCurveGeo.setAttribute('position', new THREE.BufferAttribute(phaseCurveArr, 3));
    const phaseCurveLine = new THREE.Line(phaseCurveGeo, new THREE.LineBasicMaterial({ color: 0xa855f7 }));
    scene.add(phaseCurveLine);

    const operatingMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 20, 20),
      new THREE.MeshBasicMaterial({ color: 0xf59e0b })
    );
    scene.add(operatingMarker);

    const phaseMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xa855f7 })
    );
    scene.add(phaseMarker);

    const params = {
      omegaD: 3.0,
      omega0: 3.0,
      b: 0.45,
      F0: 3.2,
      m: 1.0,
      paused: false,
      matchResonance() {
        params.omegaD = params.omega0;
        gui.controllers.forEach(c => c.updateDisplay());
      },
      reset() {
        state = [0, 0];
        simTime = 0;
      }
    };

    let state = [0, 0]; // [x, v]
    let simTime = 0;

    function rebuildResonanceCurves() {
      const { omega0, b, F0, m } = params;
      const gamma = b / m;
      for (let i = 0; i < curveSamples; i++) {
        const ratio = (i / (curveSamples - 1)) * 2.5; // omega_d / omega_0 from 0 to 2.5
        const w = ratio * omega0;
        const denom = Math.sqrt(Math.pow(omega0 * omega0 - w * w, 2) + Math.pow(gamma * w, 2));
        const A = (F0 / m) / Math.max(0.15, denom);
        const delta = Math.atan2(gamma * w, omega0 * omega0 - w * w); // 0 to PI

        const px = plotOrigin.x + (ratio / 2.5) * plotWidth;
        const pyAmp = plotOrigin.y + Math.min(plotHeight, A * 0.95);
        const pyPhase = plotOrigin.y + (delta / Math.PI) * (plotHeight * 0.75);

        ampCurveArr[i * 3] = px;
        ampCurveArr[i * 3 + 1] = pyAmp;
        ampCurveArr[i * 3 + 2] = 0;

        phaseCurveArr[i * 3] = px;
        phaseCurveArr[i * 3 + 1] = pyPhase;
        phaseCurveArr[i * 3 + 2] = -0.05;
      }
      ampCurveGeo.attributes.position.needsUpdate = true;
      phaseCurveGeo.attributes.position.needsUpdate = true;
    }

    const gui = new GUI({ title: 'Driven Resonance Controls' });
    gui.add(params, 'omegaD', 0.4, 7.5, 0.05).name('Drive \u03c9_d (rad/s)');
    gui.add(params, 'omega0', 1.5, 5.0, 0.05).name('Natural \u03c9_0 (rad/s)').onChange(rebuildResonanceCurves);
    gui.add(params, 'b', 0.12, 2.5, 0.02).name('Damping b (N\u00b7s/m)').onChange(rebuildResonanceCurves);
    gui.add(params, 'F0', 1.0, 6.0, 0.1).name('Drive Force F_0 (N)').onChange(rebuildResonanceCurves);
    gui.add(params, 'matchResonance').name('Tune \u03c9_d = \u03c9_0 (Peak)');
    gui.add(params, 'paused').name('Pause');
    gui.add(params, 'reset').name('Reset Transient');

    rebuildResonanceCurves();

    function rk4Step(s, t, dt) {
      const { omegaD, omega0, b, F0, m } = params;
      const k = m * omega0 * omega0;
      const deriv = ([x, v], time) => {
        const Fd = F0 * Math.cos(omegaD * time);
        const a = (Fd - b * v - k * x) / m;
        return [v, a];
      };
      const k1 = deriv(s, t);
      const k2 = deriv([s[0] + 0.5 * dt * k1[0], s[1] + 0.5 * dt * k1[1]], t + 0.5 * dt);
      const k3 = deriv([s[0] + 0.5 * dt * k2[0], s[1] + 0.5 * dt * k2[1]], t + 0.5 * dt);
      const k4 = deriv([s[0] + dt * k3[0], s[1] + dt * k3[1]], t + dt);
      return [
        s[0] + (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
        s[1] + (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])
      ];
    }

    function updateVisuals() {
      const { omegaD, omega0, b, F0, m } = params;
      const [x, v] = state;

      const pistonY = 3.8 + 0.35 * Math.cos(omegaD * simTime);
      pistonMesh.position.set(oscX, pistonY, 0);

      const massY = -0.5 + Math.max(-3.2, Math.min(3.2, x));
      massMesh.position.set(oscX, massY, 0);

      // Update helical spring between piston and mass
      const topY = pistonY - 0.18;
      const botY = massY + 0.63;
      for (let i = 0; i < springPts; i++) {
        const u = i / (springPts - 1);
        const ang = u * 14 * Math.PI * 2;
        const r = (i === 0 || i === springPts - 1) ? 0 : 0.36;
        springArr[i * 3] = oscX + r * Math.cos(ang);
        springArr[i * 3 + 1] = topY + u * (botY - topY);
        springArr[i * 3 + 2] = r * Math.sin(ang);
      }
      springGeo.attributes.position.needsUpdate = true;

      // Dynamic arrows
      const Fd = F0 * Math.cos(omegaD * simTime);
      driveArrow.position.set(oscX - 0.95, massY, 0);
      driveArrow.setDirection(new THREE.Vector3(0, Fd >= 0 ? 1 : -1, 0));
      driveArrow.setLength(Math.max(0.06, Math.min(2.6, Math.abs(Fd) * 0.42)), 0.28, 0.16);

      velArrow.position.set(oscX, massY, 0.75);
      velArrow.setDirection(new THREE.Vector3(0, v >= 0 ? 1 : -1, 0));
      velArrow.setLength(Math.max(0.06, Math.min(2.6, Math.abs(v) * 0.32)), 0.28, 0.16);

      const Fdamp = -b * v;
      dampArrow.position.set(oscX + 0.95, massY, 0);
      dampArrow.setDirection(new THREE.Vector3(0, Fdamp >= 0 ? 1 : -1, 0));
      dampArrow.setLength(Math.max(0.06, Math.min(2.6, Math.abs(Fdamp) * 0.5)), 0.28, 0.16);

      // Update marker on resonance curve
      const ratio = omegaD / omega0;
      const gamma = b / m;
      const denom = Math.sqrt(Math.pow(omega0 * omega0 - omegaD * omegaD, 2) + Math.pow(gamma * omegaD, 2));
      const steadyA = (F0 / m) / Math.max(0.15, denom);
      const deltaRad = Math.atan2(gamma * omegaD, omega0 * omega0 - omegaD * omegaD);
      const deltaDeg = (deltaRad * 180) / Math.PI;
      const Q = (m * omega0) / b;

      const markerX = plotOrigin.x + Math.min(1.0, ratio / 2.5) * plotWidth;
      operatingMarker.position.set(markerX, plotOrigin.y + Math.min(plotHeight, steadyA * 0.95), 0.05);
      phaseMarker.position.set(markerX, plotOrigin.y + (deltaRad / Math.PI) * (plotHeight * 0.75), 0.05);

      document.getElementById('hud-ratio').textContent = ratio.toFixed(2);
      document.getElementById('hud-amp').textContent = `${steadyA.toFixed(2)} m`;
      document.getElementById('hud-phase').innerHTML = `${deltaDeg.toFixed(1)}&deg;`;
      document.getElementById('hud-q').textContent = Q.toFixed(2);
      document.getElementById('hud-xv').textContent = `${x.toFixed(2)} m, ${v.toFixed(2)} m/s`;
    }

    updateVisuals();

    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      if (!params.paused) {
        const dt = 0.004;
        for (let i = 0; i < 4; i++) {
          state = rk4Step(state, simTime, dt);
          simTime += dt;
        }
        updateVisuals();
      }
      controls.update();
      renderer.render(scene, camera);

      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const hasNaN = isNaN(state[0]) || isNaN(state[1]);
        window.parent.postMessage({
          type: 'physicraft_telemetry',
          fps,
          hasNaN,
          errors: runtimeErrors,
          energyBounded: Math.abs(state[0]) < 50
        }, '*');
        frameCount = 0;
        lastTime = now;
      }
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
