<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>14. Chaotic Double Pendulum (RK4) with Phase Trajectory & Lyapunov Sensitivity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      overflow: hidden;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(11, 18, 32, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 345px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      font-size: 12px;
      line-height: 1.6;
      z-index: 10;
    }
    #hud h3 {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #94a3b8;
    }
    .val {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      color: #f8fafc;
      font-weight: 600;
    }
    .legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #cbd5e1;
    }
    .swatch {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h3>14. Chaotic Double Pendulum (RK4 Solver)</h3>
    <div class="row"><span>Primary Angles (&theta;<sub>1</sub>, &theta;<sub>2</sub>):</span><span class="val" id="hud-th">125.0&deg;, 100.0&deg;</span></div>
    <div class="row"><span>Phase Space (&omega;<sub>1</sub>, &omega;<sub>2</sub>):</span><span class="val" id="hud-w">0.00, 0.00 rad/s</span></div>
    <div class="row"><span>Divergence |&Delta;r&#8407;(t)|:</span><span class="val" id="hud-div">0.002 m</span></div>
    <div class="row"><span>Mechanical Energy E<sub>tot</sub>:</span><span class="val" id="hud-energy">0.00 J</span></div>
    <div class="row"><span>Dynamical Regime:</span><span class="val" id="hud-regime" style="color:#38bdf8">CHAOTIC (&lambda; &gt; 0)</span></div>
    <div class="legend">
      <span><i class="swatch" style="background:#f8fafc"></i>Primary (&theta;<sub>0</sub>)</span>
      <span><i class="swatch" style="background:#38bdf8"></i>Perturbed (&theta;<sub>0</sub>+&Delta;&theta;<sub>0</sub>)</span>
      <span><i class="swatch" style="background:#22c55e"></i>Velocity v&#8407;<sub>2</sub></span>
      <span><i class="swatch" style="background:#a855f7"></i>Phase (&theta;<sub>2</sub>, &omega;<sub>2</sub>)</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const runtimeErrors = [];
    window.addEventListener('error', (e) => runtimeErrors.push(e.message));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0.8, 1.0, 16.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(8, 15, 12);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(28, 28, 0x1e293b, 0x0f172a);
    grid.position.y = -6.0;
    scene.add(grid);

    const pivotPos = new THREE.Vector3(-2.6, 2.4, 0);
    const pivotBar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.1, 2.2, 16),
      new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.5, roughness: 0.3 })
    );
    pivotBar.rotation.x = Math.PI / 2;
    pivotBar.position.copy(pivotPos);
    scene.add(pivotBar);

    function createPendulumVisual(colorHex, zOffset) {
      const arm1Geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const arm2Geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const armMat = new THREE.LineBasicMaterial({ color: 0x94a3b8 });
      const arm1 = new THREE.Line(arm1Geo, armMat);
      const arm2 = new THREE.Line(arm2Geo, armMat);
      scene.add(arm1, arm2);

      const bob1Mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.35 });
      const bob2Mat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.65 });
      const bob1 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), bob1Mat);
      const bob2 = new THREE.Mesh(new THREE.SphereGeometry(0.38, 24, 24), bob2Mat);
      scene.add(bob1, bob2);

      const maxPts = 750;
      const trailArr = new Float32Array(maxPts * 3);
      const trailGeo = new THREE.BufferGeometry();
      trailGeo.setAttribute('position', new THREE.BufferAttribute(trailArr, 3));
      const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: colorHex }));
      scene.add(trail);

      return { arm1Geo, arm2Geo, bob1, bob2, trailArr, trailGeo, count: 0, maxPts, zOffset };
    }

    const visA = createPendulumVisual(0xf8fafc, 0.38);
    const visB = createPendulumVisual(0x38bdf8, -0.38);

    const velArrowA = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0x22c55e, 0.3, 0.18);
    const velArrowB = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0x38bdf8, 0.3, 0.18);
    scene.add(velArrowA, velArrowB);

    // 3D Phase Trajectory Board on Right (theta_2 vs omega_2)
    const phaseOrigin = new THREE.Vector3(4.3, 0.2, 0);
    const phaseAxesPts = [
      new THREE.Vector3(phaseOrigin.x - 3.2, phaseOrigin.y, 0),
      new THREE.Vector3(phaseOrigin.x + 3.2, phaseOrigin.y, 0),
      new THREE.Vector3(phaseOrigin.x, phaseOrigin.y - 3.2, 0),
      new THREE.Vector3(phaseOrigin.x, phaseOrigin.y + 3.2, 0)
    ];
    scene.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(phaseAxesPts),
      new THREE.LineBasicMaterial({ color: 0x334155 })
    ));

    const maxPhasePts = 750;
    const phaseArr = new Float32Array(maxPhasePts * 3);
    const phaseGeo = new THREE.BufferGeometry();
    phaseGeo.setAttribute('position', new THREE.BufferAttribute(phaseArr, 3));
    const phaseLine = new THREE.Line(phaseGeo, new THREE.LineBasicMaterial({ color: 0xa855f7 }));
    scene.add(phaseLine);
    let phaseCount = 0;

    const phaseDot = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xa855f7 })
    );
    scene.add(phaseDot);

    const params = {
      th1Deg: 125,
      epsDeg: 0.05,
      m1: 2.0,
      m2: 2.0,
      L1: 2.8,
      L2: 2.5,
      g: 9.81,
      paused: false,
      chaoticPreset() {
        params.th1Deg = 125;
        gui.controllers.forEach(c => c.updateDisplay());
        resetSim();
      },
      quasiPeriodicPreset() {
        params.th1Deg = 20;
        gui.controllers.forEach(c => c.updateDisplay());
        resetSim();
      },
      reset() { resetSim(); }
    };

    let stateA = [0, 0, 0, 0];
    let stateB = [0, 0, 0, 0];

    function resetSim() {
      const r1 = (params.th1Deg * Math.PI) / 180;
      const eps = (params.epsDeg * Math.PI) / 180;
      stateA = [r1, 0, r1 * 0.8, 0];
      stateB = [r1 + eps, 0, r1 * 0.8, 0];
      visA.count = 0;
      visB.count = 0;
      visA.trailGeo.setDrawRange(0, 0);
      visB.trailGeo.setDrawRange(0, 0);
      phaseCount = 0;
      phaseGeo.setDrawRange(0, 0);

      const regEl = document.getElementById('hud-regime');
      if (params.th1Deg > 45) {
        regEl.innerHTML = 'CHAOTIC (&lambda; &gt; 0)';
        regEl.style.color = '#38bdf8';
      } else {
        regEl.innerHTML = 'QUASI-PERIODIC (&lambda; &approx; 0)';
        regEl.style.color = '#22c55e';
      }
    }

    const gui = new GUI({ title: 'RK4 Double Pendulum Controls' });
    gui.add(params, 'th1Deg', 15, 170, 1).name('Release \u03b8_1 (\u00b0)').onChange(resetSim);
    gui.add(params, 'epsDeg', 0.01, 1.0, 0.01).name('Perturbation \u0394\u03b8_0 (\u00b0)').onChange(resetSim);
    gui.add(params, 'm2', 0.5, 5.0, 0.25).name('Distal Mass m_2 (kg)').onChange(() => {
      const sc = 0.8 + params.m2 * 0.12;
      visA.bob2.scale.setScalar(sc);
      visB.bob2.scale.setScalar(sc);
    });
    gui.add(params, 'g', 1.6, 24.8, 0.2).name('Gravity g (m/s\u00b2)');
    gui.add(params, 'chaoticPreset').name('Chaotic Regime (125\u00b0)');
    gui.add(params, 'quasiPeriodicPreset').name('Linear Regime (20\u00b0)');
    gui.add(params, 'paused').name('Pause');
    gui.add(params, 'reset').name('Reset Trajectories');

    function derivs(s) {
      const [t1, w1, t2, w2] = s;
      const { m1, m2, L1, L2, g } = params;
      const delta = t1 - t2;
      const den1 = L1 * (2 * m1 + m2 - m2 * Math.cos(2 * t1 - 2 * t2));
      const den2 = L2 * (2 * m1 + m2 - m2 * Math.cos(2 * t1 - 2 * t2));

      const a1 = (
        -g * (2 * m1 + m2) * Math.sin(t1) -
        m2 * g * Math.sin(t1 - 2 * t2) -
        2 * Math.sin(delta) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(delta))
      ) / den1;

      const a2 = (
        2 * Math.sin(delta) * (
          w1 * w1 * L1 * (m1 + m2) +
          g * (m1 + m2) * Math.cos(t1) +
          w2 * w2 * L2 * m2 * Math.cos(delta)
        )
      ) / den2;

      return [w1, a1, w2, a2];
    }

    function rk4Step(s, dt) {
      const k1 = derivs(s);
      const k2 = derivs(s.map((v, i) => v + 0.5 * dt * k1[i]));
      const k3 = derivs(s.map((v, i) => v + 0.5 * dt * k2[i]));
      const k4 = derivs(s.map((v, i) => v + dt * k3[i]));
      return s.map((v, i) => v + (dt / 6) * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    }

    function computeEnergy(s) {
      const [t1, w1, t2, w2] = s;
      const { m1, m2, L1, L2, g } = params;
      const T = 0.5 * (m1 + m2) * L1 * L1 * w1 * w1 +
                0.5 * m2 * L2 * L2 * w2 * w2 +
                m2 * L1 * L2 * w1 * w2 * Math.cos(t1 - t2);
      const V = -(m1 + m2) * g * L1 * Math.cos(t1) - m2 * g * L2 * Math.cos(t2);
      const Vmin = -(m1 + m2) * g * L1 - m2 * g * L2;
      return T + (V - Vmin);
    }

    function updatePendulumVis(vis, s, arrow) {
      const [t1, w1, t2, w2] = s;
      const { L1, L2 } = params;
      const x1 = pivotPos.x + L1 * Math.sin(t1);
      const y1 = pivotPos.y - L1 * Math.cos(t1);
      const x2 = x1 + L2 * Math.sin(t2);
      const y2 = y1 - L2 * Math.cos(t2);
      const z = vis.zOffset;

      vis.bob1.position.set(x1, y1, z);
      vis.bob2.position.set(x2, y2, z);
      vis.arm1Geo.setFromPoints([new THREE.Vector3(pivotPos.x, pivotPos.y, z), new THREE.Vector3(x1, y1, z)]);
      vis.arm2Geo.setFromPoints([new THREE.Vector3(x1, y1, z), new THREE.Vector3(x2, y2, z)]);

      const vx2 = L1 * w1 * Math.cos(t1) + L2 * w2 * Math.cos(t2);
      const vy2 = L1 * w1 * Math.sin(t1) + L2 * w2 * Math.sin(t2);
      const vVec = new THREE.Vector3(vx2, vy2, 0);
      const speed = vVec.length();
      arrow.position.set(x2, y2, z);
      if (speed > 0.001) {
        arrow.setDirection(vVec.normalize());
      }
      arrow.setLength(Math.max(0.06, Math.min(2.5, speed * 0.22)), 0.28, 0.16);

      if (vis.count < vis.maxPts) {
        vis.trailArr[vis.count * 3] = x2;
        vis.trailArr[vis.count * 3 + 1] = y2;
        vis.trailArr[vis.count * 3 + 2] = z;
        vis.count++;
      } else {
        vis.trailArr.copyWithin(0, 3);
        vis.trailArr[(vis.maxPts - 1) * 3] = x2;
        vis.trailArr[(vis.maxPts - 1) * 3 + 1] = y2;
        vis.trailArr[(vis.maxPts - 1) * 3 + 2] = z;
      }
      vis.trailGeo.attributes.position.needsUpdate = true;
      vis.trailGeo.setDrawRange(0, vis.count);

      return new THREE.Vector3(x2, y2, 0);
    }

    resetSim();

    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      if (!params.paused) {
        for (let i = 0; i < 6; i++) {
          stateA = rk4Step(stateA, 0.003);
          stateB = rk4Step(stateB, 0.003);
        }
        const pA = updatePendulumVis(visA, stateA, velArrowA);
        const pB = updatePendulumVis(visB, stateB, velArrowB);

        // Update Phase Trajectory (wrapped theta2 vs omega2)
        const wrappedTh2 = Math.atan2(Math.sin(stateA[2]), Math.cos(stateA[2]));
        const px = phaseOrigin.x + wrappedTh2 * 0.9;
        const py = phaseOrigin.y + stateA[3] * 0.32;
        phaseDot.position.set(px, py, 0.05);

        if (phaseCount < maxPhasePts) {
          phaseArr[phaseCount * 3] = px;
          phaseArr[phaseCount * 3 + 1] = py;
          phaseArr[phaseCount * 3 + 2] = 0;
          phaseCount++;
        } else {
          phaseArr.copyWithin(0, 3);
          phaseArr[(maxPhasePts - 1) * 3] = px;
          phaseArr[(maxPhasePts - 1) * 3 + 1] = py;
          phaseArr[(maxPhasePts - 1) * 3 + 2] = 0;
        }
        phaseGeo.attributes.position.needsUpdate = true;
        phaseGeo.setDrawRange(0, phaseCount);

        const dist = pA.distanceTo(pB);
        const Etot = computeEnergy(stateA);
        document.getElementById('hud-th').innerHTML =
          `${((stateA[0] * 180) / Math.PI).toFixed(1)}&deg;, ${((stateA[2] * 180) / Math.PI).toFixed(1)}&deg;`;
        document.getElementById('hud-w').textContent =
          `${stateA[1].toFixed(2)}, ${stateA[3].toFixed(2)} rad/s`;
        document.getElementById('hud-div').textContent = `${dist.toFixed(3)} m`;
        document.getElementById('hud-energy').textContent = `${Etot.toFixed(1)} J`;
      }

      controls.update();
      renderer.render(scene, camera);

      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const hasNaN = isNaN(stateA[0]) || isNaN(stateB[0]);
        window.parent.postMessage({
          type: 'physicraft_telemetry',
          fps,
          hasNaN,
          errors: runtimeErrors,
          energyBounded: Math.abs(stateA[1]) < 200
        }, '*');
        frameCount = 0;
        lastTime = now;
      }
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
