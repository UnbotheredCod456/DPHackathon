<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>19. Brownian Motion: Heavy Particle & Mean-Square Displacement Trail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070b14; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; bottom: 18px; left: 18px; z-index: 10;
    background: rgba(10, 16, 30, 0.88); backdrop-filter: blur(10px);
    border: 1px solid rgba(99, 179, 237, 0.28); border-radius: 12px;
    padding: 14px 18px; min-width: 325px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    font-size: 12.5px; line-height: 1.55;
  }
  #hud h2 { font-size: 14px; font-weight: 700; color: #63b3ed; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .label { color: #94a3b8; }
  .val { color: #f8fafc; font-weight: 600; }
  .legend { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(148,163,184,0.18); display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h2>Brownian Motion & Mean-Square Displacement</h2>
  <div class="row"><span class="label">Instantaneous MSD r²(t):</span><span class="val" id="v-msd">0.00 μm²</span></div>
  <div class="row"><span class="label">Einstein 6Dt Reference:</span><span class="val" id="v-ein">0.00 μm²</span></div>
  <div class="row"><span class="label">Total Collisions:</span><span class="val" id="v-hits">0</span></div>
  <div class="row"><span class="label">Elapsed Time t:</span><span class="val" id="v-time">0.0 s</span></div>
  <div class="legend">
    <span><i class="dot" style="background:#facc15"></i>Pollen Grain & Random-Walk Trail</span>
    <span><i class="dot" style="background:#38bdf8"></i>Pollen Velocity v</span>
    <span><i class="dot" style="background:#f43f5e"></i>Thermal Kick Impulse</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(13, 10, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

scene.add(new THREE.AmbientLight(0x94a3b8, 0.8));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(14, 20, 14);
scene.add(dirLight);

const boxHalf = 5.5;
const boxWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(boxHalf * 2, boxHalf * 2, boxHalf * 2)),
  new THREE.LineBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.65 })
);
scene.add(boxWire);

const params = {
  temperature: 340,
  massRatio: 35,
  gasCount: 220,
  paused: false,
  reset: () => resetSim()
};

// Heavy Pollen Grain
const R_pollen = 0.78;
const pollenMesh = new THREE.Mesh(
  new THREE.SphereGeometry(R_pollen, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.35, roughness: 0.3 })
);
scene.add(pollenMesh);

// Einstein RMS Diffusion Sphere (wireframe expanding shell <r^2> = 6Dt)
const rmsSphere = new THREE.Mesh(
  new THREE.SphereGeometry(1, 20, 20),
  new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true, transparent: true, opacity: 0.18 })
);
scene.add(rmsSphere);

// 3D Random Walk Trail
const maxTrail = 1200;
const trailArr = new Float32Array(maxTrail * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailArr, 3));
const trailLine = new THREE.Line(
  trailGeo,
  new THREE.LineBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.92 })
);
scene.add(trailLine);
let trailLen = 0;

// Arrows on Pollen Grain
const velArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1.5, 0x38bdf8, 0.35, 0.2);
const kickArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1.5, 0xf43f5e, 0.35, 0.2);
scene.add(velArrow, kickArrow);

// Thermal Gas Bath Molecules
const maxGas = 320;
const r_gas = 0.14;
const gasInst = new THREE.InstancedMesh(
  new THREE.SphereGeometry(r_gas, 10, 10),
  new THREE.MeshStandardMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.75 }),
  maxGas
);
gasInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(gasInst);

const gPos = new Float32Array(maxGas * 3);
const gVel = new Float32Array(maxGas * 3);
const dummy = new THREE.Object3D();

let pPos = new THREE.Vector3();
let pVel = new THREE.Vector3();
let lastKick = new THREE.Vector3(0.4, 0.2, -0.3);
let totalHits = 0;
let elapsed = 0;

function resetSim() {
  pPos.set(0, 0, 0);
  pVel.set(0, 0, 0);
  pollenMesh.position.set(0, 0, 0);
  totalHits = 0;
  elapsed = 0;
  trailLen = 0;
  trailGeo.setDrawRange(0, 0);

  const N = params.gasCount;
  gasInst.count = N;
  const spdScale = Math.sqrt(params.temperature / 100) * 5.2;

  for (let i = 0; i < N; i++) {
    let x, y, z;
    do {
      x = (Math.random() * 2 - 1) * (boxHalf - 0.3);
      y = (Math.random() * 2 - 1) * (boxHalf - 0.3);
      z = (Math.random() * 2 - 1) * (boxHalf - 0.3);
    } while (Math.hypot(x, y, z) < R_pollen + r_gas + 0.3);

    gPos[i * 3] = x; gPos[i * 3 + 1] = y; gPos[i * 3 + 2] = z;
    gVel[i * 3] = (Math.random() - 0.5) * 2 * spdScale;
    gVel[i * 3 + 1] = (Math.random() - 0.5) * 2 * spdScale;
    gVel[i * 3 + 2] = (Math.random() - 0.5) * 2 * spdScale;
  }
}

const gui = new GUI({ title: 'Brownian Motion Controls' });
gui.add(params, 'temperature', 100, 800, 20).name('Bath Temp T (K)').onChange(() => resetSim());
gui.add(params, 'massRatio', 10, 100, 5).name('Mass Ratio M/m');
gui.add(params, 'gasCount', 80, 320, 20).name('Gas Molecules N').onChange(() => resetSim());
gui.add(params, 'paused').name('Pause');
gui.add(params, 'reset').name('Reset Random Walk');

resetSim();

let lastTime = performance.now();
let frames = 0;
let lastTelemetry = performance.now();
let runtimeErrors = [];
window.addEventListener('error', (e) => runtimeErrors.push(e.message));

function animate(now) {
  requestAnimationFrame(animate);
  frames++;
  const dt = Math.min((now - lastTime) / 1000, 0.035);
  lastTime = now;

  const N = params.gasCount;
  const M = params.massRatio;
  const minDist = R_pollen + r_gas;

  if (!params.paused) {
    elapsed += dt;
    let kickSum = new THREE.Vector3();

    // Update Heavy Particle
    pPos.addScaledVector(pVel, dt);
    const limP = boxHalf - R_pollen;
    if (Math.abs(pPos.x) > limP) { pPos.x = Math.sign(pPos.x) * limP; pVel.x *= -0.8; }
    if (Math.abs(pPos.y) > limP) { pPos.y = Math.sign(pPos.y) * limP; pVel.y *= -0.8; }
    if (Math.abs(pPos.z) > limP) { pPos.z = Math.sign(pPos.z) * limP; pVel.z *= -0.8; }

    // Update Gas Molecules & Elastic Momentum Transfer with Heavy Particle
    const limG = boxHalf - r_gas;
    for (let i = 0; i < N; i++) {
      let x = gPos[i * 3] + gVel[i * 3] * dt;
      let y = gPos[i * 3 + 1] + gVel[i * 3 + 1] * dt;
      let z = gPos[i * 3 + 2] + gVel[i * 3 + 2] * dt;

      if (Math.abs(x) > limG) { x = Math.sign(x) * limG; gVel[i * 3] *= -1; }
      if (Math.abs(y) > limG) { y = Math.sign(y) * limG; gVel[i * 3 + 1] *= -1; }
      if (Math.abs(z) > limG) { z = Math.sign(z) * limG; gVel[i * 3 + 2] *= -1; }

      const dx = x - pPos.x;
      const dy = y - pPos.y;
      const dz = z - pPos.z;
      const dSq = dx * dx + dy * dy + dz * dz;

      if (dSq < minDist * minDist && dSq > 1e-6) {
        const d = Math.sqrt(dSq);
        const nx = dx / d, ny = dy / d, nz = dz / d;
        // Push gas molecule outside overlap
        x = pPos.x + nx * minDist;
        y = pPos.y + ny * minDist;
        z = pPos.z + nz * minDist;

        const rvx = gVel[i * 3] - pVel.x;
        const rvy = gVel[i * 3 + 1] - pVel.y;
        const rvz = gVel[i * 3 + 2] - pVel.z;
        const vn = rvx * nx + rvy * ny + rvz * nz;

        if (vn < 0) {
          const jImp = -(2 * M / (M + 1)) * vn;
          gVel[i * 3] += (jImp / 1) * nx;
          gVel[i * 3 + 1] += (jImp / 1) * ny;
          gVel[i * 3 + 2] += (jImp / 1) * nz;

          const dvPx = -(jImp / M) * nx;
          const dvPy = -(jImp / M) * ny;
          const dvPz = -(jImp / M) * nz;
          pVel.x += dvPx; pVel.y += dvPy; pVel.z += dvPz;
          kickSum.x += dvPx; kickSum.y += dvPy; kickSum.z += dvPz;
          totalHits++;
        }
      }

      gPos[i * 3] = x; gPos[i * 3 + 1] = y; gPos[i * 3 + 2] = z;
      dummy.position.set(x, y, z);
      dummy.updateMatrix();
      gasInst.setMatrixAt(i, dummy.matrix);
    }
    gasInst.instanceMatrix.needsUpdate = true;

    if (kickSum.lengthSq() > 1e-5) {
      lastKick.lerp(kickSum.normalize(), 0.45);
    }

    pollenMesh.position.copy(pPos);

    if (trailLen < maxTrail) {
      trailArr[trailLen * 3] = pPos.x;
      trailArr[trailLen * 3 + 1] = pPos.y;
      trailArr[trailLen * 3 + 2] = pPos.z;
      trailLen++;
    } else {
      trailArr.copyWithin(0, 3);
      trailArr[(maxTrail - 1) * 3] = pPos.x;
      trailArr[(maxTrail - 1) * 3 + 1] = pPos.y;
      trailArr[(maxTrail - 1) * 3 + 2] = pPos.z;
    }
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.setDrawRange(0, trailLen);
  }

  // Update Arrows & Einstein Reference
  velArrow.position.copy(pPos);
  const pSpd = pVel.length();
  if (pSpd > 1e-4) {
    velArrow.setDirection(pVel.clone().normalize());
    velArrow.setLength(Math.min(2.8, 0.8 + pSpd * 0.9), 0.35, 0.2);
  }

  kickArrow.position.copy(pPos);
  kickArrow.setDirection(lastKick.clone().normalize());
  kickArrow.setLength(1.65, 0.35, 0.2);

  const msd = pPos.lengthSq();
  const D_eff = (params.temperature / 340) * (35 / params.massRatio) * 0.085;
  const einsteinMSD = Math.min(24, 6 * D_eff * elapsed);
  const rmsRad = Math.max(0.2, Math.sqrt(einsteinMSD));
  rmsSphere.scale.setScalar(rmsRad);

  document.getElementById('v-msd').textContent = `${msd.toFixed(2)} μm²`;
  document.getElementById('v-ein').textContent = `${einsteinMSD.toFixed(2)} μm²`;
  document.getElementById('v-hits').textContent = `${totalHits}`;
  document.getElementById('v-time').textContent = `${elapsed.toFixed(1)} s`;

  if (now - lastTelemetry >= 1000) {
    const fps = Math.round((frames * 1000) / (now - lastTelemetry));
    frames = 0;
    lastTelemetry = now;
    window.parent.postMessage({
      type: 'physicraft_telemetry',
      fps,
      hasNaN: !Number.isFinite(msd),
      errors: runtimeErrors,
      energyBounded: pSpd < 50
    }, '*');
  }

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
