<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>16. Restricted Three-Body Problem: Earth-Moon Lagrange Points</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070b14; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; bottom: 18px; left: 18px; z-index: 10;
    background: rgba(10, 16, 30, 0.86); backdrop-filter: blur(10px);
    border: 1px solid rgba(99, 179, 237, 0.28); border-radius: 12px;
    padding: 14px 18px; min-width: 310px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    font-size: 12.5px; line-height: 1.55;
  }
  #hud h2 { font-size: 14px; font-weight: 700; color: #63b3ed; margin-bottom: 6px; letter-spacing: 0.3px; }
  .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .label { color: #94a3b8; }
  .val { color: #f8fafc; font-weight: 600; }
  .legend { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(148,163,184,0.18); display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h2>Restricted Three-Body: Lagrange Points (L1–L5)</h2>
  <div class="row"><span class="label">Mass Ratio μ = M₂/(M₁+M₂):</span><span class="val" id="v-mu">0.120</span></div>
  <div class="row"><span class="label">Jacobi Constant C_J:</span><span class="val" id="v-cj">3.150</span></div>
  <div class="row"><span class="label">Satellite Radius r:</span><span class="val" id="v-r">0.00</span></div>
  <div class="row"><span class="label">Co-rotating Speed |v|:</span><span class="val" id="v-spd">0.00</span></div>
  <div class="row"><span class="label">Selected Injection Preset:</span><span class="val" id="v-preset">L4 Tadpole</span></div>
  <div class="legend">
    <span><i class="dot" style="background:#38bdf8"></i>Velocity v</span>
    <span><i class="dot" style="background:#f43f5e"></i>Gravity + Centrifugal</span>
    <span><i class="dot" style="background:#a855f7"></i>Coriolis Force</span>
    <span><i class="dot" style="background:#facc15"></i>L1–L5 Markers</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import GUI from 'lil-gui';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);
scene.fog = new THREE.FogExp2(0x070b14, 0.015);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 18, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

// Lights
scene.add(new THREE.AmbientLight(0x94a3b8, 0.75));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(12, 25, 15);
scene.add(dirLight);

// Starfield
const starGeo = new THREE.BufferGeometry();
const starPts = new Float32Array(1200 * 3);
for (let i = 0; i < 1200 * 3; i++) starPts[i] = (Math.random() - 0.5) * 160;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x64748b, size: 0.22 })));

// Scale: separation D = 10 units
const D = 10.0;
const omega = 1.0;

const params = {
  mu: 0.12,
  preset: 'L4 Tadpole',
  vPerturb: 0.04,
  showSurface: true,
  timeScale: 1.0,
  paused: false,
  reset: () => resetSimulation()
};

// Primary (Earth) & Secondary (Moon)
const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x2563eb, emissive: 0x1d4ed8, emissiveIntensity: 0.35, roughness: 0.35 })
);
scene.add(earthMesh);

const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.58, 32, 32),
  new THREE.MeshStandardMaterial({ color: 0x94a3b8, emissive: 0x475569, emissiveIntensity: 0.25, roughness: 0.6 })
);
scene.add(moonMesh);

// Test Satellite
const satMesh = new THREE.Mesh(
  new THREE.SphereGeometry(0.24, 24, 24),
  new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x06b6d4, emissiveIntensity: 0.8 })
);
scene.add(satMesh);

// Lagrange Point Markers L1..L5
const lMarkers = [];
for (let i = 0; i < 5; i++) {
  const m = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.26, 0),
    new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xca8a04, emissiveIntensity: 0.65 })
  );
  scene.add(m);
  lMarkers.push(m);
}

// Effective Potential Surface Mesh
const gridN = 64;
const surfSize = 26;
const surfGeo = new THREE.PlaneGeometry(surfSize, surfSize, gridN, gridN);
surfGeo.rotateX(-Math.PI / 2);
const surfMat = new THREE.MeshStandardMaterial({
  color: 0x1e293b,
  emissive: 0x0f172a,
  wireframe: true,
  transparent: true,
  opacity: 0.42
});
const surfMesh = new THREE.Mesh(surfGeo, surfMat);
surfMesh.position.y = -3.2;
scene.add(surfMesh);

// Orbit Trail
const maxTrail = 900;
const trailPositions = new Float32Array(maxTrail * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
const trailLine = new THREE.Line(
  trailGeo,
  new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.85 })
);
scene.add(trailLine);
let trailCount = 0;

// Dynamic Vector Arrows
const velArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1.5, 0x38bdf8, 0.35, 0.2);
const effArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1.5, 0xf43f5e, 0.35, 0.2);
const corArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1.5, 0xa855f7, 0.35, 0.2);
scene.add(velArrow, effArrow, corArrow);

// Physics state in normalized co-rotating coordinates (x, z in horizontal plane, D=1 internally then scaled by D)
let state = { x: 0, z: 0, vx: 0, vz: 0 };
let runtimeErrors = [];
window.addEventListener('error', (e) => runtimeErrors.push(e.message));

function computeLagrangePoints(mu) {
  const x1 = -mu;
  const x2 = 1 - mu;
  const rHill = Math.pow(mu / 3, 1 / 3);
  const L1 = [x2 - rHill * (1 - rHill / 3), 0];
  const L2 = [x2 + rHill * (1 + rHill / 3), 0];
  const L3 = [-(1 + (5 / 12) * mu), 0];
  const L4 = [0.5 - mu, Math.sqrt(3) / 2];
  const L5 = [0.5 - mu, -Math.sqrt(3) / 2];
  return [L1, L2, L3, L4, L5];
}

// Singularity-softened accelerations in normalized rotating frame (scaled to world D)
function getAccelerations(x, z, vx, vz, mu) {
  const x1 = -mu * D;
  const x2 = (1 - mu) * D;
  const dx1 = x - x1;
  const dx2 = x - x2;
  // Softening factor Math.max(1.5, r*r) as required by physics convention
  const r1Sq = Math.max(1.5, dx1 * dx1 + z * z);
  const r2Sq = Math.max(1.5, dx2 * dx2 + z * z);
  const r1 = Math.sqrt(r1Sq);
  const r2 = Math.sqrt(r2Sq);

  const GM = D * D * D * omega * omega;
  const gm1 = (1 - mu) * GM;
  const gm2 = mu * GM;

  // Gravitational + Centrifugal in rotating frame (x, z)
  const gx = -gm1 * dx1 / (r1Sq * r1) - gm2 * dx2 / (r2Sq * r2) + omega * omega * x;
  const gz = -gm1 * z / (r1Sq * r1) - gm2 * z / (r2Sq * r2) + omega * omega * z;

  // Coriolis acceleration in (x, z) plane: +2*omega*vz, -2*omega*vx
  const corX = 2 * omega * vz;
  const corZ = -2 * omega * vx;

  return { ax: gx + corX, az: gz + corZ, gx, gz, corX, corZ, r1, r2, gm1, gm2 };
}

function updateEffectiveSurface(mu) {
  const pos = surfGeo.attributes.position;
  const x1 = -mu * D;
  const x2 = (1 - mu) * D;
  const GM = D * D * D * omega * omega;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const r1Sq = Math.max(1.5, (x - x1) * (x - x1) + z * z);
    const r2Sq = Math.max(1.5, (x - x2) * (x - x2) + z * z);
    const uEff = -((1 - mu) * GM) / Math.sqrt(r1Sq) - (mu * GM) / Math.sqrt(r2Sq) - 0.5 * omega * omega * (x * x + z * z);
    const height = Math.max(-4.5, Math.min(2.2, -uEff * 0.015 - 2.6));
    pos.setY(i, height);
  }
  pos.needsUpdate = true;
  surfGeo.computeVertexNormals();

  earthMesh.position.set(x1, 0, 0);
  moonMesh.position.set(x2, 0, 0);

  const pts = computeLagrangePoints(mu);
  pts.forEach((p, idx) => {
    lMarkers[idx].position.set(p[0] * D, 0, p[1] * D);
  });
}

function resetSimulation() {
  updateEffectiveSurface(params.mu);
  const pts = computeLagrangePoints(params.mu);
  let target = pts[3]; // L4 default
  if (params.preset === 'L1 Halo') target = pts[0];
  else if (params.preset === 'L2 Halo') target = pts[1];
  else if (params.preset === 'L3 Orbit') target = pts[2];
  else if (params.preset === 'L4 Tadpole') target = pts[3];
  else if (params.preset === 'L5 Tadpole') target = pts[4];

  state.x = target[0] * D + 0.32;
  state.z = target[1] * D + 0.18;
  state.vx = params.vPerturb * D * 0.4;
  state.vz = -params.vPerturb * D * 0.6;

  trailCount = 0;
  for (let i = 0; i < maxTrail * 3; i++) trailPositions[i] = 0;
  trailGeo.setDrawRange(0, 0);
  document.getElementById('v-preset').textContent = params.preset;
}

// RK4 Symplectic-grade step for rotating frame
function stepRK4(dt) {
  const mu = params.mu;
  const f = (s) => {
    const a = getAccelerations(s.x, s.z, s.vx, s.vz, mu);
    return { dx: s.vx, dz: s.vz, dvx: a.ax, dvz: a.az };
  };

  const k1 = f(state);
  const k2 = f({
    x: state.x + 0.5 * dt * k1.dx,
    z: state.z + 0.5 * dt * k1.dz,
    vx: state.vx + 0.5 * dt * k1.dvx,
    vz: state.vz + 0.5 * dt * k1.dvz
  });
  const k3 = f({
    x: state.x + 0.5 * dt * k2.dx,
    z: state.z + 0.5 * dt * k2.dz,
    vx: state.vx + 0.5 * dt * k2.dvx,
    vz: state.vz + 0.5 * dt * k2.dvz
  });
  const k4 = f({
    x: state.x + dt * k3.dx,
    z: state.z + dt * k3.dz,
    vx: state.vx + dt * k3.dvx,
    vz: state.vz + dt * k3.dvz
  });

  state.x += (dt / 6) * (k1.dx + 2 * k2.dx + 2 * k3.dx + k4.dx);
  state.z += (dt / 6) * (k1.dz + 2 * k2.dz + 2 * k3.dz + k4.dz);
  state.vx += (dt / 6) * (k1.dvx + 2 * k2.dvx + 2 * k3.dvx + k4.dvx);
  state.vz += (dt / 6) * (k1.dvz + 2 * k2.dvz + 2 * k3.dvz + k4.dvz);

  // Soft boundary containment so particle stays observable
  const rad = Math.hypot(state.x, state.z);
  if (rad > 13.5) {
    state.x *= 13.5 / rad;
    state.z *= 13.5 / rad;
    state.vx *= -0.5;
    state.vz *= -0.5;
  }
}

// GUI
const gui = new GUI({ title: 'Three-Body Lagrange Controls' });
gui.add(params, 'mu', 0.01, 0.35, 0.005).name('Mass Ratio μ').onChange(() => resetSimulation());
gui.add(params, 'preset', ['L4 Tadpole', 'L5 Tadpole', 'L1 Halo', 'L2 Halo', 'L3 Orbit']).name('Orbit Preset').onChange(() => resetSimulation());
gui.add(params, 'vPerturb', 0.0, 0.25, 0.005).name('Perturbation δv').onChange(() => resetSimulation());
gui.add(params, 'timeScale', 0.2, 2.5, 0.1).name('Time Scale');
gui.add(params, 'showSurface').name('Potential Surface').onChange(v => { surfMesh.visible = v; });
gui.add(params, 'paused').name('Pause Simulation');
gui.add(params, 'reset').name('Reset Satellite');

resetSimulation();

let lastTime = performance.now();
let frames = 0;
let currentFps = 60;
let lastTelemetry = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  frames++;
  const dtRaw = Math.min((now - lastTime) / 1000, 0.04);
  lastTime = now;

  if (!params.paused) {
    const subSteps = 6;
    const h = (dtRaw * params.timeScale * 0.45) / subSteps;
    for (let i = 0; i < subSteps; i++) stepRK4(h);

    satMesh.position.set(state.x, 0, state.z);

    // Record trail
    if (trailCount < maxTrail) {
      trailPositions[trailCount * 3] = state.x;
      trailPositions[trailCount * 3 + 1] = 0;
      trailPositions[trailCount * 3 + 2] = state.z;
      trailCount++;
    } else {
      trailPositions.copyWithin(0, 3);
      trailPositions[(maxTrail - 1) * 3] = state.x;
      trailPositions[(maxTrail - 1) * 3 + 1] = 0;
      trailPositions[(maxTrail - 1) * 3 + 2] = state.z;
    }
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.setDrawRange(0, trailCount);
  }

  // Update arrows & HUD
  const acc = getAccelerations(state.x, state.z, state.vx, state.vz, params.mu);
  const posVec = satMesh.position;

  const vMag = Math.hypot(state.vx, state.vz);
  velArrow.position.copy(posVec);
  if (vMag > 1e-4) {
    velArrow.setDirection(new THREE.Vector3(state.vx / vMag, 0, state.vz / vMag));
    velArrow.setLength(Math.min(3.2, 0.5 + vMag * 0.65), 0.32, 0.18);
  }

  const gMag = Math.hypot(acc.gx, acc.gz);
  effArrow.position.copy(posVec);
  if (gMag > 1e-4) {
    effArrow.setDirection(new THREE.Vector3(acc.gx / gMag, 0, acc.gz / gMag));
    effArrow.setLength(Math.min(3.2, 0.4 + gMag * 0.04), 0.32, 0.18);
  }

  const cMag = Math.hypot(acc.corX, acc.corZ);
  corArrow.position.copy(posVec);
  if (cMag > 1e-4) {
    corArrow.setDirection(new THREE.Vector3(acc.corX / cMag, 0, acc.corZ / cMag));
    corArrow.setLength(Math.min(3.0, 0.4 + cMag * 0.25), 0.32, 0.18);
  }

  const cj = (omega * omega * (state.x * state.x + state.z * state.z) + 2 * (acc.gm1 / acc.r1 + acc.gm2 / acc.r2) - vMag * vMag) / (D * D);
  document.getElementById('v-mu').textContent = params.mu.toFixed(3);
  document.getElementById('v-cj').textContent = cj.toFixed(3);
  document.getElementById('v-r').textContent = (Math.hypot(state.x, state.z) / D).toFixed(3) + ' D';
  document.getElementById('v-spd').textContent = (vMag / D).toFixed(3) + ' D/s';

  if (now - lastTelemetry >= 1000) {
    currentFps = Math.round((frames * 1000) / (now - lastTelemetry));
    frames = 0;
    lastTelemetry = now;
    const hasNaN = !Number.isFinite(state.x) || !Number.isFinite(state.z) || !Number.isFinite(cj);
    window.parent.postMessage({
      type: 'physicraft_telemetry',
      fps: currentFps,
      hasNaN,
      errors: runtimeErrors,
      energyBounded: Math.abs(cj) < 50
    }, '*');
  }

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
