<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhysiCraft — 02. Inclined Plane & 3D Free-Body Diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #070b14; color: #e2e8f0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(10px);
    border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 12px;
    padding: 14px 18px; min-width: 305px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    font-size: 12.5px; line-height: 1.55;
  }
  #hud h3 { font-size: 13px; color: #38bdf8; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
  .row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
  .label { color: #94a3b8; }
  .val { color: #f8fafc; font-weight: 600; }
  .badge { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .legend { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(148,163,184,0.18); display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h3>02 · Inclined Plane &amp; Live 3D FBD</h3>
  <div class="row"><span class="label">Regime:</span><span class="val" id="hRegime">STATIC</span></div>
  <div class="row"><span class="label">Critical Angle θ_c = atan(μ_s):</span><span class="val" id="hCrit">0.0°</span></div>
  <div class="row"><span class="label">Gravity Parallel mg·sin(θ):</span><span class="val" id="hFgPar">0.00 N</span></div>
  <div class="row"><span class="label">Normal Force N = mg·cos(θ):</span><span class="val" id="hNorm">0.00 N</span></div>
  <div class="row"><span class="label">Friction Force f:</span><span class="val" id="hFric">0.00 N</span></div>
  <div class="row"><span class="label">Acceleration a &amp; Speed v:</span><span class="val" id="hKin">0.00 m/s² | 0.00 m/s</span></div>
  <div class="legend">
    <span><i class="dot" style="background:#38bdf8"></i>Normal N</span>
    <span><i class="dot" style="background:#f43f5e"></i>Gravity mg</span>
    <span><i class="dot" style="background:#f59e0b"></i>Friction f</span>
    <span><i class="dot" style="background:#22c55e"></i>Velocity v</span>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GUI } from 'lil-gui';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b14);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 7.5, 19);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 3.2, 0);

scene.add(new THREE.AmbientLight(0x94a3b8, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
dirLight.position.set(12, 22, 16);
dirLight.castShadow = true;
scene.add(dirLight);

const grid = new THREE.GridHelper(60, 30, 0x1e293b, 0x111827);
scene.add(grid);

// Pivot group at bottom-right of ramp so ramp tilts naturally
const RAMP_LEN = 14;
const rampPivot = new THREE.Group();
rampPivot.position.set(6, 0.2, 0);
scene.add(rampPivot);

const plankGeo = new THREE.BoxGeometry(RAMP_LEN, 0.4, 3.6);
plankGeo.translate(-RAMP_LEN / 2, -0.2, 0);
const plankMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.4, roughness: 0.45 });
const plankMesh = new THREE.Mesh(plankGeo, plankMat);
plankMesh.receiveShadow = true;
rampPivot.add(plankMesh);

// Glowing side rails on plank
const railGeo = new THREE.BoxGeometry(RAMP_LEN, 0.08, 0.08);
railGeo.translate(-RAMP_LEN / 2, 0.04, 1.75);
const railMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
rampPivot.add(new THREE.Mesh(railGeo, railMat));

// Sliding Block inside rampPivot local coordinates
const blockGroup = new THREE.Group();
rampPivot.add(blockGroup);

const blockMesh = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 1.0, 1.6),
  new THREE.MeshStandardMaterial({ color: 0x6366f1, emissive: 0x312e81, emissiveIntensity: 0.35, roughness: 0.25, metalness: 0.3 })
);
blockMesh.position.y = 0.5;
blockMesh.castShadow = true;
blockGroup.add(blockMesh);

// World-space FBD Arrows anchored at block center
const normalArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 3, 0x38bdf8, 0.45, 0.28);
const gravArrow = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 3, 0xf43f5e, 0.45, 0.28);
const fricArrow = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(), 2, 0xf59e0b, 0.45, 0.28);
const velArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 2, 0x22c55e, 0.45, 0.28);
scene.add(normalArrow, gravArrow, fricArrow, velArrow);

const params = {
  angleDeg: 24.0,
  mass: 3.0,
  muStatic: 0.40,
  muKinetic: 0.28,
  gravity: 9.81,
  paused: false,
  reset: () => resetBlock()
};

const state = {
  s: 11.8, // distance from bottom pivot up along the ramp
  v: 0,
  a: 0,
  sliding: false
};

function resetBlock() {
  state.s = 11.8;
  state.v = 0;
  state.a = 0;
  state.sliding = false;
}

const gui = new GUI({ title: 'Inclined Plane Controls' });
gui.add(params, 'angleDeg', 2, 60, 0.5).name('Ramp Angle θ (°)');
gui.add(params, 'mass', 0.5, 10, 0.5).name('Block Mass m (kg)');
gui.add(params, 'muStatic', 0.0, 1.0, 0.02).name('Static μ_s').onChange(() => {
  if (params.muKinetic > params.muStatic) params.muKinetic = params.muStatic;
});
gui.add(params, 'muKinetic', 0.0, 1.0, 0.02).name('Kinetic μ_k');
gui.add(params, 'paused').name('Pause Simulation');
gui.add(params, 'reset').name('Reset Block to Top');

resetBlock();

// Telemetry Heartbeat
let frameCount = 0;
let lastFpsTime = performance.now();
let currentFps = 60;
const runtimeErrors = [];
window.addEventListener('error', (e) => runtimeErrors.push(e.message));

setInterval(() => {
  window.parent.postMessage({
    type: 'physicraft_telemetry',
    fps: Math.round(currentFps),
    hasNaN: Number.isNaN(state.s) || Number.isNaN(state.v),
    errors: runtimeErrors.slice(-5),
    energyBounded: true
  }, '*');
}, 1000);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 500) {
    currentFps = (frameCount * 1000) / (now - lastFpsTime);
    frameCount = 0;
    lastFpsTime = now;
  }

  const theta = THREE.MathUtils.degToRad(params.angleDeg);
  rampPivot.rotation.z = -theta; // tilts up to the left (-X, +Y)

  const mg = params.mass * params.gravity;
  const fgPar = mg * Math.sin(theta);
  const normF = mg * Math.cos(theta);
  const fStaticMax = params.muStatic * normF;
  let fricF = 0;

  if (!params.paused) {
    if (!state.sliding && Math.abs(state.v) < 1e-4) {
      if (fgPar > fStaticMax) {
        state.sliding = true;
      } else {
        fricF = fgPar;
        state.a = 0;
        state.v = 0;
      }
    }
    if (state.sliding) {
      fricF = params.muKinetic * normF;
      state.a = (fgPar - fricF) / params.mass;
      state.v += state.a * dt;
      state.s -= state.v * dt;
      if (state.s <= 1.2) {
        state.s = 11.8;
        state.v = 0;
      }
    }
  } else {
    fricF = state.sliding ? params.muKinetic * normF : Math.min(fgPar, fStaticMax);
  }

  blockGroup.position.set(-state.s, 0, 0);

  // Compute world center of block for FBD vectors
  const worldCenter = new THREE.Vector3(0, 0.5, 0);
  blockGroup.localToWorld(worldCenter);

  const scaleF = 0.12;
  // Normal direction in world: (sin(theta), cos(theta), 0)
  const nDir = new THREE.Vector3(Math.sin(theta), Math.cos(theta), 0).normalize();
  normalArrow.position.copy(worldCenter);
  normalArrow.setDirection(nDir);
  normalArrow.setLength(Math.max(0.8, normF * scaleF), 0.42, 0.24);

  // Gravity direction: (0, -1, 0)
  gravArrow.position.copy(worldCenter);
  gravArrow.setDirection(new THREE.Vector3(0, -1, 0));
  gravArrow.setLength(Math.max(0.8, mg * scaleF), 0.42, 0.24);

  // Friction direction up the ramp: (-cos(theta), sin(theta), 0)
  const upRampDir = new THREE.Vector3(-Math.cos(theta), Math.sin(theta), 0).normalize();
  fricArrow.position.copy(worldCenter);
  if (fricF > 0.05) {
    fricArrow.visible = true;
    fricArrow.setDirection(upRampDir);
    fricArrow.setLength(Math.max(0.6, fricF * scaleF * 1.4), 0.38, 0.22);
  } else {
    fricArrow.visible = false;
  }

  // Velocity direction down the ramp: (cos(theta), -sin(theta), 0)
  const downRampDir = upRampDir.clone().negate();
  velArrow.position.copy(worldCenter);
  if (state.v > 0.05) {
    velArrow.visible = true;
    velArrow.setDirection(downRampDir);
    velArrow.setLength(Math.min(4.5, 0.7 + state.v * 0.35), 0.38, 0.22);
  } else {
    velArrow.visible = false;
  }

  // Update HUD
  const critDeg = THREE.MathUtils.radToDeg(Math.atan(params.muStatic));
  const regimeEl = document.getElementById('hRegime');
  regimeEl.textContent = state.sliding ? 'KINETIC SLIDING' : 'STATIC EQUILIBRIUM';
  regimeEl.style.color = state.sliding ? '#22c55e' : '#f59e0b';
  document.getElementById('hCrit').textContent = `${critDeg.toFixed(1)}°`;
  document.getElementById('hFgPar').textContent = `${fgPar.toFixed(2)} N`;
  document.getElementById('hNorm').textContent = `${normF.toFixed(2)} N`;
  document.getElementById('hFric').textContent = `${fricF.toFixed(2)} N`;
  document.getElementById('hKin').textContent = `${state.a.toFixed(2)} m/s² | ${state.v.toFixed(2)} m/s`;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
