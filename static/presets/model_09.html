<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model 09 — The Dzhanibekov (Tennis Racket) Theorem</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #070b14;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; }
    #hud {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(10, 16, 30, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 355px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    #hud h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.2);
      padding-bottom: 6px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      margin: 5px 0;
      font-variant-numeric: tabular-nums;
    }
    .hud-label { color: #94a3b8; }
    .hud-val { color: #f8fafc; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11.5px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <h2>Dzhanibekov Theorem (I₁ &lt; I₂ &lt; I₃ RK4)</h2>
    <div class="hud-row"><span class="hud-label">Body ω = (ω₁, ω₂, ω₃):</span><span class="hud-val" id="val-omega">(0.0, 0.0, 0.0)</span></div>
    <div class="hud-row"><span class="hud-label">Intermediate Flip (e₂ · L̂):</span><span class="hud-val" id="val-flip">+1.00</span></div>
    <div class="hud-row"><span class="hud-label">Flip Count:</span><span class="hud-val" id="val-flips">0 flips</span></div>
    <div class="hud-row"><span class="hud-label">Conserved |L| (Inertial):</span><span class="hud-val" id="val-l">0.000 N·m·s</span></div>
    <div class="hud-row"><span class="hud-label">Conserved KE (½ ω·I·ω):</span><span class="hud-val" id="val-ke">0.000 J</span></div>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:#38bdf8"></span>Inertial L (Fixed)</div>
      <div class="legend-item"><span class="dot" style="background:#f43f5e"></span>Instantaneous ω</div>
      <div class="legend-item"><span class="dot" style="background:#10b981"></span>Intermediate Axis (e₂)</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.018);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(6.5, 5.2, 7.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0x94a3b8, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(10, 15, 12);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(24, 24, 0x1e293b, 0x0f172a);
    grid.position.y = -3.8;
    scene.add(grid);

    const params = {
      I1: 1.0,
      I2: 2.4,
      I3: 4.2,
      spinSpeed: 7.5,
      perturbation: 0.08,
      primaryAxis: 'Intermediate (I2 - Unstable)',
      showVectors: true,
      paused: false,
      reset: () => initRigidBody()
    };

    // Build T-handle / Wingnut asymmetric rigid body mesh
    // Local X = axis 1 (smallest I1, central shaft), Local Y = axis 2 (intermediate I2, T-stem), Local Z = axis 3 (largest I3)
    const bodyGroup = new THREE.Group();
    scene.add(bodyGroup);

    const mainBar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 4.2, 28),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.6, roughness: 0.25 })
    );
    mainBar.rotation.z = Math.PI / 2; // Along X axis (I1)
    bodyGroup.add(mainBar);

    // End weights on X axis
    const capGeo = new THREE.SphereGeometry(0.45, 24, 20);
    const capMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.7, roughness: 0.2 });
    const capL = new THREE.Mesh(capGeo, capMat);
    const capR = new THREE.Mesh(capGeo, capMat);
    capL.position.set(-2.1, 0, 0);
    capR.position.set(2.1, 0, 0);
    bodyGroup.add(capL, capR);

    // Intermediate axis handle along +Y/-Y (I2)
    const handleStem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.24, 0.24, 2.5, 24),
      new THREE.MeshStandardMaterial({ color: 0x10b981, metalness: 0.5, roughness: 0.3 })
    );
    handleStem.position.set(0, 1.1, 0);
    bodyGroup.add(handleStem);

    const handleTip = new THREE.Mesh(
      new THREE.SphereGeometry(0.38, 24, 20),
      new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0x881337, emissiveIntensity: 0.4 })
    );
    handleTip.position.set(0, 2.35, 0);
    bodyGroup.add(handleTip);

    // Vectors in world frame
    const lArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 3.8, 0x38bdf8, 0.45, 0.26);
    const wArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 3.4, 0xf43f5e, 0.42, 0.24);
    const e2Arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 3.0, 0x10b981, 0.38, 0.22);
    scene.add(lArrow, wArrow, e2Arrow);

    // Trail of the intermediate handle tip
    const maxTrail = 500;
    const trailCoords = new Float32Array(maxTrail * 3);
    const trailGeo = new THREE.BufferGeometry();
    trailGeo.setAttribute('position', new THREE.BufferAttribute(trailCoords, 3));
    const trailLine = new THREE.Line(
      trailGeo,
      new THREE.LineBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.8 })
    );
    scene.add(trailLine);
    let trailCount = 0;

    // State: body angular velocity omega = (w1, w2, w3) and orientation quaternion q
    let omega = new THREE.Vector3();
    let quat = new THREE.Quaternion();
    let initialKE = 0;
    let flipCount = 0;
    let lastFlipSign = 1;

    function eulerDot(w) {
      const { I1, I2, I3 } = params;
      return new THREE.Vector3(
        ((I2 - I3) / I1) * w.y * w.z,
        ((I3 - I1) / I2) * w.z * w.x,
        ((I1 - I2) / I3) * w.x * w.y
      );
    }

    function quatDot(q, w) {
      const wQuat = new THREE.Quaternion(w.x * 0.5, w.y * 0.5, w.z * 0.5, 0);
      return new THREE.Quaternion().multiplyQuaternions(q, wQuat);
    }

    function addScaledQuat(qBase, qDelta, scale) {
      return new THREE.Quaternion(
        qBase.x + qDelta.x * scale,
        qBase.y + qDelta.y * scale,
        qBase.z + qDelta.z * scale,
        qBase.w + qDelta.w * scale
      );
    }

    function initRigidBody() {
      quat.identity();
      if (params.primaryAxis.startsWith('Intermediate')) {
        omega.set(params.perturbation, params.spinSpeed, params.perturbation * 0.7);
      } else if (params.primaryAxis.startsWith('Minor')) {
        omega.set(params.spinSpeed, params.perturbation, params.perturbation);
      } else {
        omega.set(params.perturbation, params.perturbation, params.spinSpeed);
      }
      initialKE = 0.5 * (params.I1 * omega.x ** 2 + params.I2 * omega.y ** 2 + params.I3 * omega.z ** 2);
      flipCount = 0;
      lastFlipSign = Math.sign(omega.y) || 1;
      trailCount = 0;
      trailGeo.setDrawRange(0, 0);
    }

    function stepRK4(dt) {
      const steps = 8;
      const h = dt / steps;
      for (let i = 0; i < steps; i++) {
        const kw1 = eulerDot(omega);
        const kq1 = quatDot(quat, omega);

        const w2 = omega.clone().addScaledVector(kw1, 0.5 * h);
        const q2 = addScaledQuat(quat, kq1, 0.5 * h).normalize();
        const kw2 = eulerDot(w2);
        const kq2 = quatDot(q2, w2);

        const w3 = omega.clone().addScaledVector(kw2, 0.5 * h);
        const q3 = addScaledQuat(quat, kq2, 0.5 * h).normalize();
        const kw3 = eulerDot(w3);
        const kq3 = quatDot(q3, w3);

        const w4 = omega.clone().addScaledVector(kw3, h);
        const q4 = addScaledQuat(quat, kq3, h).normalize();
        const kw4 = eulerDot(w4);
        const kq4 = quatDot(q4, w4);

        omega.x += (h / 6) * (kw1.x + 2 * kw2.x + 2 * kw3.x + kw4.x);
        omega.y += (h / 6) * (kw1.y + 2 * kw2.y + 2 * kw3.y + kw4.y);
        omega.z += (h / 6) * (kw1.z + 2 * kw2.z + 2 * kw3.z + kw4.z);

        quat.x += (h / 6) * (kq1.x + 2 * kq2.x + 2 * kq3.x + kq4.x);
        quat.y += (h / 6) * (kq1.y + 2 * kq2.y + 2 * kq3.y + kq4.y);
        quat.z += (h / 6) * (kq1.z + 2 * kq2.z + 2 * kq3.z + kq4.z);
        quat.w += (h / 6) * (kq1.w + 2 * kq2.w + 2 * kq3.w + kq4.w);
        quat.normalize();
      }
    }

    const gui = new GUI({ title: 'Dzhanibekov Controls' });
    gui.add(params, 'primaryAxis', [
      'Intermediate (I2 - Unstable)',
      'Minor Axis (I1 - Stable)',
      'Major Axis (I3 - Stable)'
    ]).name('Spin Axis').onChange(initRigidBody);
    gui.add(params, 'I1', 0.4, 1.8, 0.1).name('Moment I₁ (Minor)').onChange(initRigidBody);
    gui.add(params, 'I2', 1.9, 3.3, 0.1).name('Moment I₂ (Interm.)').onChange(initRigidBody);
    gui.add(params, 'I3', 3.4, 6.0, 0.1).name('Moment I₃ (Major)').onChange(initRigidBody);
    gui.add(params, 'spinSpeed', 3.0, 14.0, 0.5).name('Spin Speed ω₀').onChange(initRigidBody);
    gui.add(params, 'perturbation', 0.005, 0.5, 0.005).name('Perturbation ε').onChange(initRigidBody);
    gui.add(params, 'showVectors').name('Show Vectors');
    gui.add(params, 'paused').name('Pause');
    gui.add(params, 'reset').name('↻ Reset Body');

    initRigidBody();

    let frameCount = 0;
    let lastTelemetry = performance.now();
    const runtimeErrors = [];
    window.addEventListener('error', (e) => runtimeErrors.push(e.message));

    let prevTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      frameCount++;
      const dt = Math.min(0.03, (now - prevTime) / 1000);
      prevTime = now;

      if (!params.paused) {
        stepRK4(dt);
      }

      bodyGroup.quaternion.copy(quat);

      // Compute inertial angular momentum L_world = R(q) * (I * omega)
      const L_body = new THREE.Vector3(params.I1 * omega.x, params.I2 * omega.y, params.I3 * omega.z);
      const L_world = L_body.clone().applyQuaternion(quat);
      const omega_world = omega.clone().applyQuaternion(quat);
      const e2_world = new THREE.Vector3(0, 1, 0).applyQuaternion(quat);

      // Detect 180-degree intermediate axis flips
      const alignDot = e2_world.dot(L_world.clone().normalize());
      if (Math.abs(alignDot) > 0.65) {
        const currentSign = Math.sign(alignDot);
        if (currentSign !== 0 && currentSign !== lastFlipSign) {
          flipCount++;
          lastFlipSign = currentSign;
        }
      }

      // Update tip trail
      if (!params.paused) {
        const tipWorld = e2_world.clone().multiplyScalar(2.35);
        if (trailCount < maxTrail) {
          trailCoords[trailCount * 3] = tipWorld.x;
          trailCoords[trailCount * 3 + 1] = tipWorld.y;
          trailCoords[trailCount * 3 + 2] = tipWorld.z;
          trailCount++;
        } else {
          trailCoords.copyWithin(0, 3);
          trailCoords[(maxTrail - 1) * 3] = tipWorld.x;
          trailCoords[(maxTrail - 1) * 3 + 1] = tipWorld.y;
          trailCoords[(maxTrail - 1) * 3 + 2] = tipWorld.z;
        }
        trailGeo.attributes.position.needsUpdate = true;
        trailGeo.setDrawRange(0, trailCount);
      }

      lArrow.visible = params.showVectors;
      wArrow.visible = params.showVectors;
      e2Arrow.visible = params.showVectors;

      lArrow.setDirection(L_world.clone().normalize());
      lArrow.setLength(3.7, 0.45, 0.25);
      wArrow.setDirection(omega_world.clone().normalize());
      wArrow.setLength(3.2, 0.4, 0.22);
      e2Arrow.setDirection(e2_world);
      e2Arrow.setLength(2.9, 0.36, 0.2);

      const ke = 0.5 * (params.I1 * omega.x ** 2 + params.I2 * omega.y ** 2 + params.I3 * omega.z ** 2);

      document.getElementById('val-omega').textContent =
        `(${omega.x.toFixed(1)}, ${omega.y.toFixed(1)}, ${omega.z.toFixed(1)})`;
      document.getElementById('val-flip').textContent = alignDot >= 0 ? `+${alignDot.toFixed(2)}` : alignDot.toFixed(2);
      document.getElementById('val-flips').textContent = `${flipCount} flips`;
      document.getElementById('val-l').textContent = `${L_world.length().toFixed(3)} N·m·s`;
      document.getElementById('val-ke').textContent = `${ke.toFixed(3)} J`;

      controls.update();
      renderer.render(scene, camera);

      if (now - lastTelemetry >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTelemetry));
        const keErr = Math.abs(ke - initialKE) / (initialKE + 1e-6);
        window.parent.postMessage({
          type: 'physicraft_telemetry',
          fps,
          hasNaN: Number.isNaN(omega.x) || Number.isNaN(quat.w),
          errors: runtimeErrors,
          energyBounded: keErr < 0.01
        }, '*');
        frameCount = 0;
        lastTelemetry = now;
      }
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
