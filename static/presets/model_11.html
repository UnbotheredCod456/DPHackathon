<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>11. Simple Harmonic Motion: Mass-Spring & Pendulum with Phase Space</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #070b14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      overflow: hidden;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(11, 18, 32, 0.84);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 310px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      font-size: 12px;
      line-height: 1.6;
      z-index: 10;
    }
    #hud h3 {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #94a3b8;
    }
    .val {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
      color: #f8fafc;
      font-weight: 600;
    }
    .legend {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #cbd5e1;
    }
    .swatch {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h3>11. Simple Harmonic Motion &amp; Phase Portrait</h3>
    <div class="row"><span>Spring Displacement x(t):</span><span class="val" id="hud-x">0.00 m</span></div>
    <div class="row"><span>Spring Velocity v(t):</span><span class="val" id="hud-v">0.00 m/s</span></div>
    <div class="row"><span>Pendulum Angle &theta;(t):</span><span class="val" id="hud-th">0.0&deg;</span></div>
    <div class="row"><span>Natural Freq (&omega;<sub>s</sub>, &omega;<sub>p</sub>):</span><span class="val" id="hud-w">0.00, 0.00 rad/s</span></div>
    <div class="row"><span>Spring Energy (K + U = E):</span><span class="val" id="hud-e">0.00 J</span></div>
    <div class="legend">
      <span><i class="swatch" style="background:#22c55e"></i>Velocity v&#8407;</span>
      <span><i class="swatch" style="background:#ef4444"></i>Restoring Force F&#8407;</span>
      <span><i class="swatch" style="background:#38bdf8"></i>Phase (x, v/&omega;<sub>0</sub>)</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import GUI from 'lil-gui';

    const runtimeErrors = [];
    window.addEventListener('error', (e) => runtimeErrors.push(e.message));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.015);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 3.5, 16.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0.5, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(8, 16, 12);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(28, 28, 0x1e293b, 0x0f172a);
    grid.position.y = -4.5;
    scene.add(grid);

    // Top support frame
    const beamMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.35 });
    const topBeam = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 0.8), beamMat);
    topBeam.position.set(-2.0, 4.5, 0);
    scene.add(topBeam);

    // 1. Mass-Spring System (x = -5.5)
    const springAnchorX = -5.5;
    const eqY = 0.2;
    const springTurns = 16;
    const springPtsCount = 160;
    const springPositions = new Float32Array(springPtsCount * 3);
    const springGeo = new THREE.BufferGeometry();
    springGeo.setAttribute('position', new THREE.BufferAttribute(springPositions, 3));
    const springLine = new THREE.Line(
      springGeo,
      new THREE.LineBasicMaterial({ color: 0x94a3b8 })
    );
    scene.add(springLine);

    const massMesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 1.1, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.35, roughness: 0.25 })
    );
    scene.add(massMesh);

    const velArrowSpring = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0x22c55e, 0.32, 0.18);
    const forceArrowSpring = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0xef4444, 0.32, 0.18);
    scene.add(velArrowSpring, forceArrowSpring);

    // 2. Simple Pendulum (x = -0.3)
    const pendAnchor = new THREE.Vector3(-0.3, 4.5, 0);
    const rodGeo = new THREE.BufferGeometry().setFromPoints([pendAnchor, new THREE.Vector3(-0.3, 0.5, 0)]);
    const rodLine = new THREE.Line(rodGeo, new THREE.LineBasicMaterial({ color: 0xcbdaed }));
    scene.add(rodLine);

    const bobMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.48, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0x7e22ce, emissiveIntensity: 0.35, roughness: 0.2 })
    );
    scene.add(bobMesh);

    const velArrowPend = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(), 1, 0x22c55e, 0.32, 0.18);
    const forceArrowPend = new THREE.ArrowHelper(new THREE.Vector3(-1, 0, 0), new THREE.Vector3(), 1, 0xef4444, 0.32, 0.18);
    scene.add(velArrowPend, forceArrowPend);

    // 3. 3D Phase Space Portrait Board (x = +5.2)
    const phaseOrigin = new THREE.Vector3(5.2, 0.3, 0);
    const phaseRing = new THREE.Mesh(
      new THREE.RingGeometry(2.75, 2.8, 64),
      new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide })
    );
    phaseRing.position.copy(phaseOrigin);
    scene.add(phaseRing);

    const axesPts = [
      new THREE.Vector3(phaseOrigin.x - 3.0, phaseOrigin.y, 0),
      new THREE.Vector3(phaseOrigin.x + 3.0, phaseOrigin.y, 0),
      new THREE.Vector3(phaseOrigin.x, phaseOrigin.y - 3.0, 0),
      new THREE.Vector3(phaseOrigin.x, phaseOrigin.y + 3.0, 0)
    ];
    const phaseAxes = new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(axesPts),
      new THREE.LineBasicMaterial({ color: 0x334155 })
    );
    scene.add(phaseAxes);

    const maxPhasePts = 450;
    const phaseArr = new Float32Array(maxPhasePts * 3);
    const phaseGeo = new THREE.BufferGeometry();
    phaseGeo.setAttribute('position', new THREE.BufferAttribute(phaseArr, 3));
    const phaseLine = new THREE.Line(phaseGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8 }));
    scene.add(phaseLine);
    let phaseCount = 0;

    const phaseDot = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
    );
    scene.add(phaseDot);

    const params = {
      k: 18.0,
      m: 2.0,
      A: 2.0,
      L: 3.8,
      theta0Deg: 32,
      g: 9.81,
      paused: false,
      reset() { resetSim(); }
    };

    // State: [x, v] for spring; [theta, omega] for pendulum
    let springState = [params.A, 0];
    let pendState = [(params.theta0Deg * Math.PI) / 180, 0];

    function resetSim() {
      springState = [params.A, 0];
      pendState = [(params.theta0Deg * Math.PI) / 180, 0];
      phaseCount = 0;
      phaseGeo.setDrawRange(0, 0);
    }

    const gui = new GUI({ title: 'SHM & Phase Space Controls' });
    gui.add(params, 'k', 4.0, 45.0, 0.5).name('Spring k (N/m)').onChange(resetSim);
    gui.add(params, 'm', 0.5, 6.0, 0.1).name('Mass m (kg)').onChange(resetSim);
    gui.add(params, 'A', 0.5, 2.6, 0.1).name('Amplitude A (m)').onChange(resetSim);
    gui.add(params, 'L', 2.0, 5.5, 0.1).name('Pendulum L (m)').onChange(resetSim);
    gui.add(params, 'theta0Deg', 5, 85, 1).name('Release \u03b8\u2080 (\u00b0)').onChange(resetSim);
    gui.add(params, 'g', 1.6, 24.8, 0.1).name('Gravity g (m/s\u00b2)').onChange(resetSim);
    gui.add(params, 'paused').name('Pause Simulation');
    gui.add(params, 'reset').name('Reset Phase Portrait');

    function rk4Spring(s, dt) {
      const f = ([x, v]) => [v, -(params.k / params.m) * x];
      const k1 = f(s);
      const k2 = f([s[0] + 0.5 * dt * k1[0], s[1] + 0.5 * dt * k1[1]]);
      const k3 = f([s[0] + 0.5 * dt * k2[0], s[1] + 0.5 * dt * k2[1]]);
      const k4 = f([s[0] + dt * k3[0], s[1] + dt * k3[1]]);
      return [
        s[0] + (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
        s[1] + (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])
      ];
    }

    function rk4Pend(s, dt) {
      const f = ([th, w]) => [w, -(params.g / params.L) * Math.sin(th)];
      const k1 = f(s);
      const k2 = f([s[0] + 0.5 * dt * k1[0], s[1] + 0.5 * dt * k1[1]]);
      const k3 = f([s[0] + 0.5 * dt * k2[0], s[1] + 0.5 * dt * k2[1]]);
      const k4 = f([s[0] + dt * k3[0], s[1] + dt * k3[1]]);
      return [
        s[0] + (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]),
        s[1] + (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])
      ];
    }

    function updateScene() {
      const [x, v] = springState;
      const massY = eqY + x;
      massMesh.position.set(springAnchorX, massY, 0);

      // Update helical spring coil geometry
      const topY = 4.35;
      const bottomY = massY + 0.55;
      for (let i = 0; i < springPtsCount; i++) {
        const u = i / (springPtsCount - 1);
        const angle = u * springTurns * Math.PI * 2;
        const r = (i === 0 || i === springPtsCount - 1) ? 0 : 0.35;
        springPositions[i * 3] = springAnchorX + r * Math.cos(angle);
        springPositions[i * 3 + 1] = topY + u * (bottomY - topY);
        springPositions[i * 3 + 2] = r * Math.sin(angle);
      }
      springGeo.attributes.position.needsUpdate = true;

      // Spring arrows
      const vLen = Math.abs(v) * 0.28;
      velArrowSpring.position.set(springAnchorX - 0.75, massY, 0);
      velArrowSpring.setDirection(new THREE.Vector3(0, v >= 0 ? 1 : -1, 0));
      velArrowSpring.setLength(Math.max(0.05, Math.min(2.6, vLen)), 0.28, 0.16);

      const fVal = -params.k * x;
      const fLen = Math.abs(fVal) * 0.06;
      forceArrowSpring.position.set(springAnchorX + 0.75, massY, 0);
      forceArrowSpring.setDirection(new THREE.Vector3(0, fVal >= 0 ? 1 : -1, 0));
      forceArrowSpring.setLength(Math.max(0.05, Math.min(2.6, fLen)), 0.28, 0.16);

      // Pendulum update
      const [th, w] = pendState;
      const bx = pendAnchor.x + params.L * Math.sin(th);
      const by = pendAnchor.y - params.L * Math.cos(th);
      bobMesh.position.set(bx, by, 0);
      rodGeo.setFromPoints([pendAnchor, new THREE.Vector3(bx, by, 0)]);

      const tangDir = new THREE.Vector3(Math.cos(th), Math.sin(th), 0);
      const vPend = w * params.L;
      velArrowPend.position.set(bx, by, 0);
      velArrowPend.setDirection(tangDir.clone().multiplyScalar(vPend >= 0 ? 1 : -1).normalize());
      velArrowPend.setLength(Math.max(0.05, Math.min(2.6, Math.abs(vPend) * 0.35)), 0.28, 0.16);

      const fTang = -params.g * Math.sin(th);
      forceArrowPend.position.set(bx, by, 0);
      forceArrowPend.setDirection(tangDir.clone().multiplyScalar(fTang >= 0 ? 1 : -1).normalize());
      forceArrowPend.setLength(Math.max(0.05, Math.min(2.6, Math.abs(fTang) * 0.22)), 0.28, 0.16);

      // Phase portrait (x vs v / omega0)
      const omega0 = Math.sqrt(params.k / params.m);
      const px = phaseOrigin.x + x * 0.95;
      const py = phaseOrigin.y + (v / omega0) * 0.95;
      phaseDot.position.set(px, py, 0.05);

      if (phaseCount < maxPhasePts) {
        phaseArr[phaseCount * 3] = px;
        phaseArr[phaseCount * 3 + 1] = py;
        phaseArr[phaseCount * 3 + 2] = 0;
        phaseCount++;
      } else {
        phaseArr.copyWithin(0, 3);
        phaseArr[(maxPhasePts - 1) * 3] = px;
        phaseArr[(maxPhasePts - 1) * 3 + 1] = py;
        phaseArr[(maxPhasePts - 1) * 3 + 2] = 0;
      }
      phaseGeo.attributes.position.needsUpdate = true;
      phaseGeo.setDrawRange(0, phaseCount);

      // HUD telemetry
      const omegaP = Math.sqrt(params.g / params.L);
      const energy = 0.5 * params.m * v * v + 0.5 * params.k * x * x;
      document.getElementById('hud-x').textContent = `${x.toFixed(2)} m`;
      document.getElementById('hud-v').textContent = `${v.toFixed(2)} m/s`;
      document.getElementById('hud-th').innerHTML = `${((th * 180) / Math.PI).toFixed(1)}&deg;`;
      document.getElementById('hud-w').textContent = `${omega0.toFixed(2)}, ${omegaP.toFixed(2)} rad/s`;
      document.getElementById('hud-e').textContent = `${energy.toFixed(2)} J`;
    }

    resetSim();
    updateScene();

    let frameCount = 0;
    let lastTime = performance.now();

    function animate() {
      requestAnimationFrame(animate);
      if (!params.paused) {
        const dt = 0.004;
        for (let i = 0; i < 4; i++) {
          springState = rk4Spring(springState, dt);
          pendState = rk4Pend(pendState, dt);
        }
        updateScene();
      }
      controls.update();
      renderer.render(scene, camera);

      frameCount++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        const fps = Math.round((frameCount * 1000) / (now - lastTime));
        const hasNaN = isNaN(springState[0]) || isNaN(pendState[0]);
        window.parent.postMessage({
          type: 'physicraft_telemetry',
          fps,
          hasNaN,
          errors: runtimeErrors,
          energyBounded: Math.abs(springState[0]) < 20
        }, '*');
        frameCount = 0;
        lastTime = now;
      }
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
